# ОПЕРАТОРЫ ПЛАТФОРМЫ — второй уровень модели.
#
# Модель: ПЛАТФОРМА (ИП) -> ОПЕРАТОР (маркетолог или агентство) -> КЛИЕНТ ОПЕРАТОРА (рекламодатель).
# Деньги проводятся через платформу. Платформа берёт КОМИССИЮ ЗА СЕРВИС, оператор получает
# КЭШБЭК за ведение рекламы. Клиенты оператора связываются с оператором полем operator_id
# в registry/clients.yaml.
#
# cashback_pct — ставка кэшбэка оператора, % от оборота его клиентов.

version: 1
updated: "2026-11-01"

settings:
  platform_commission_pct: 7      # комиссия платформы за сервис, % от оборота — это ДОХОД платформы
  ipo_registered: false           # оформлен ли ИП. Пока false — режим «через сервис» заблокирован предупреждением
  note: "Оборот — это чужие деньги, прошедшие через платформу. Налоговая база считается с КОМИССИИ, а не с оборота."

