# prices.yaml — цены моделей ZvenoAI для агентов-маркетологов (schema prices/v1)
#
# Зачем: считать «эффективность на рубль» и выбирать модель для агента,
# подагентов и сложного анализа. Все цены — МИНИМАЛЬНЫЕ среди провайдеров,
# которые обслуживают модель (на странице модели это «от N ₽ за 1M»).
# Подписка ZvenoAI даёт до −45% на часть моделей; здесь — цена без подписки.
#
# Источники: страницы моделей zveno.ai (у каждой модели указан source),
# курс ЦБ РФ на дату rate_date. Ключ API в файле не хранится и не нужен.
#
# Пересчёт: usd = rub / rate.usd_rub. «Типовой ход» = 100 000 токенов на входе
# и 20 000 на выходе — порядок величины для агентской задачи (снимок
# конкурентов, разбор выдачи, черновик отчёта).

