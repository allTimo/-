    model: z-ai/glm-5.3-flash
    why: 'принимает изображения, 3,15/6,86 ₽ за 1M — дешевле любого другого мультимодального варианта; для рядовых скриншотов ещё дешевле бесплатная цепочка vision-router (OVH, без ключа, 2 запроса/мин на модель)'
