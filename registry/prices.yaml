    model: openai/gpt-6-luna
    why: 'ступень выше Flash при умеренной цене 19,33/96,66 ₽ за 1M (типовой ход ≈ 3,87 ₽, в 4,7 раза дешевле v4-pro ≈ 23,20 ₽); принимает изображения и файлы'
