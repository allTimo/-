# Финальные результаты работы агентов: что сделано и КУДА ОТПРАВЛЕНО.
#
# Зачем: пользователь хочет видеть не только прогоны, но и сам результат работы —
# готовый артефакт и факт его отправки заказчику.
#
# Схема одной записи:
#   id            — идентификатор результата
#   title         — короткое название («Отчёт по конкурентам за неделю»)
#   summary       — что сделано, одной фразой
#   client        — id клиента из clients.yaml (может быть пусто)
#   project       — id проекта из projects.yaml (может быть пусто)
#   period        — за какой период («2026-10-23 — 2026-10-30»)
#   agent         — id агента-исполнителя из agents.yaml
#   service       — id услуги из services.yaml
#   created       — когда результат готов (ISO)
#   artifacts     — список файлов результата (пути от корня marketing-agents)
#   sent_channel  — канал отправки: telegram | vk | whatsapp | email | link | download | none
#   sent_to       — куда именно (канал/чат/адрес) — правится вручную
#   sent_at       — когда отправлено (ISO) или null
#   sent_status   — отправлено | ожидает | ошибка | не отправлялось
#
# В MVP отправка выполняется ВРУЧНУЮ (или агентом по команде): панель фиксирует факт,
# но сама сообщения не рассылает. Поле «куда отправлено» редактируемое.

