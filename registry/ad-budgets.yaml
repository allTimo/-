# РЕКЛАМНЫЕ БЮДЖЕТЫ: пополнения и расходы по клиенту и каналу.
#
# РЕЖИМ (юридически важно):
#   client-pays      — клиент платит площадке сам со своего счёта; мы получаем вознаграждение
#                      за услугу ведения. Это чистая услуга, НПД подходит.
#   through-service  — деньги клиента проходят через сервис, а мы оплачиваем площадки.
#                      Это агентская/комиссионная схема: по 422-ФЗ НПД НЕ применяется.
#                      Требуется ИП или ООО; при НПД выставляем вознаграждение за ведение.
#
# rate_pct — переопределение ставки для этого клиента и канала (пусто = ставка канала).

