<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Центр управления агентами</title>
<meta name="description" content="Панель управления сервисом: агенты, услуги, клиенты, источники, расход в токенах и рублях.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside id="sidebar" class="sidebar" aria-label="Навигация"></aside>
  <div class="content">
    <header class="topbar">
      <div class="brand">
        <div class="brand-text">
          <h1>Центр управления агентами</h1>
          <div class="sub" id="brandSub">панель оператора · данные только из ваших сессий DSH и реестра</div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="pill" id="genAt" title="когда собраны данные">—</span>
        <button class="btn" id="btnRefresh" title="Пересобрать данные из логов и реестра">Обновить данные</button>
      </div>
    </header>

    <div class="testmode" id="testmode" hidden>Тестовый режим на ПК • управление разрешено</div>

    <main id="view" class="view">
      <div class="loading">Загружаю данные панели…</div>
    </main>

    <footer class="footer" id="footer"></footer>
  </div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Детали"></aside>

<script src="app.js"></script>
<script src="sidebar.js"></script>
<script src="app-views.js"></script>
<script src="app-views2.js"></script>
<script src="app-views3.js"></script>
<script src="app-views4.js"></script>
<script src="app-views6.js"></script>
<script src="app-views7.js"></script>
<script src="app-views8.js"></script>
<script src="app-views9.js"></script>
<script src="app-views10.js"></script>
<script src="app-views11.js"></script>
<script src="app-views12.js"></script>
<script src="app-views13.js"></script>
<script src="app-views14.js"></script>
</body>
</html>
