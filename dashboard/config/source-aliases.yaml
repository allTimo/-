# Соответствие «значение колонки source в lots.csv» -> «id источника в registry/sources.yaml».
#
# Зачем: снимки пишет движок Агента 1, и он может называть источник короче, чем реестр.
# Без этого соответствия дашборд честно показал бы такой источник как «нет в реестре»
# и не учёл бы его лоты в статистике.
#
# Правится вручную. Значения слева — то, что реально лежит в снимках.
#
# Обоснование текущей записи: снимок _demo-site-zilart-2026-10-31 содержит 15 лотов с
# source=site, а в registry/sources.yaml у developer-sites прямо написано
# «Доказан на zilart.ru: 15 позиций». Совпадение и по количеству, и по объекту.

version: 1
updated: "2026-10-31"

aliases:
  site: developer-sites
