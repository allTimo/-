# ОБРАЗЕЦ СХЕМЫ прайса. Сборщик дашборда этот файл НЕ ЧИТАЕТ.
#
# Единственный источник цен — marketing-agents/registry/prices.yaml (его пишет агент T11).
# Здесь только описание полей, чтобы было понятно, что класть в реестр.
# Чисел намеренно нет: два прайса с разными числами — это разъехавшиеся суммы в рублях.
#
# Обязательные поля одного блока модели:
#   rub_per_1m_in         — рублей за 1 млн входных (некэшированных) токенов
#   rub_per_1m_out        — рублей за 1 млн выходных токенов
#   rub_per_1m_cache_read — рублей за 1 млн токенов чтения из кэша (null = не опубликовано;
#                           тогда сборщик считает кэш по цене входа и помечает это как оценку сверху)
# Необязательные: usd_per_1m_* (зеркало в долларах), accepts_images, context_tokens,
#   rub_per_typical_turn_100k_in_20k_out, source.
#
# Курс валюты:
#   rate:
#     usd_rub: <число>      # обязателен для пересчёта в доллары
#     date: <ISO-дата>
#     source: <откуда курс>
#
# Пиковые часы (необязательно). Если блок есть, сборщик сам смотрит на время каждого
# события и умножает ставку для событий, попавших в окно:
#   peak:
#     multiplier: 2
#     windows_utc: ["01:00-04:00", "06:00-10:00"]
#     weekdays: [1, 2, 3, 4, 5]

schema: prices/v1
fetched_at: '<YYYY-MM-DD>'
rate:
  usd_rub: 0.0
  date: '<ISO-дата>'
  source: '<ссылка на источник курса>'
price_unit: per_1m_tokens
price_kind: minimum_across_providers

models:
  provider/model-id:
    rub_per_1m_in: 0.0
    rub_per_1m_out: 0.0
    rub_per_1m_cache_read: null
    accepts_images: true
    context_tokens: 0
    source: '<ссылка на страницу модели>'
