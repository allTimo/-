# Какие агенты реестра работают с каким источником мониторинга.
#
# Зачем: registry/sources.yaml не содержит поля «кто собирает», а без этого на
# вкладке «Аналитика» нельзя честно показать «источник -> агенты -> сколько это
# стоило». Дашборд сначала пробует угадать связь по полям inputs/groups агента,
# а этот файл задаёт связь явно и имеет приоритет.
#
# Обоснование текущих записей:
#   developer-sites — в sources.yaml помечен как «основной путь с 31.10.2026»,
#     команда запуска collect-developer-sites.mjs лежит в контуре Агента 1;
#     снимок _demo-site-zilart-2026-10-31 (15 лотов) собран его движком.
#   cian, avito — прямо перечислены во входах Агента 1 (cian-connector, avito-connector).
#
# Файл необязательный: без него связи определяются только по именам.

version: 1
updated: "2026-10-31"

sources:
  developer-sites: [agent-1-competitor-watch]
  cian: [agent-1-competitor-watch]
  avito: [agent-1-competitor-watch]
