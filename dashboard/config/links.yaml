# Связь агентов реестра (registry/agents.yaml) с исполнителями DSH.
#
# В логах сессий агенты называются именами из team/member (например,
# agent1-workspace, data-engine). Здесь мы говорим дашборду, кто из них
# работает на какого агента реестра — тогда на вкладке «Агенты» видно
# расход и активность конкретного агента, а не безымянные сессии.
#
# Файл необязательный: без него дашборд просто покажет исполнителей отдельно.
# Правится вручную, перезапуск сборщика подхватывает изменения.

version: 1
updated: "2026-10-31"

links:
  agent-1-competitor-watch: [agent1-workspace, data-engine, verifier]

# Исполнители, которые строят саму систему (не относятся ни к одному агенту реестра).
system:
  - plugin-dev
  - dashboard-ui
  - dashboard-dev
