# ВКЛАДКИ РАЗДЕЛА «АГЕНТЫ» — один файл, из которого строится раздел.
#
# Чтобы добавить агентскую категорию (например «Агенты-креативы»), допишите запись сюда.
# Логику править не нужно: раздел сам нарисует вкладку и вызовет экран с этим id.
#
# Поля записи:
#   id      — идентификатор вкладки; под ним должен существовать экран VIEWS[id]
#   label   — название вкладки
#   hint    — короткое пояснение под переключателем
#   enabled — false = вкладка показана, но серым с пометкой «скоро» (место под будущее)
#
# Адреса: раздел открывается как #agents, вкладка задаётся ссылкой #agents/<id>
# (#agents/sources — источники). Старые ссылки #sources тоже работают.

version: 1
updated: "2026-11-01"
section:
  id: agents
  label: "Агенты"
  icon: "bot"

tabs:
  - { id: executors, label: "Исполнители", hint: "Кто выполняет работу: карточки агентов, тумблеры включения, задачи и расход.", enabled: true }
  - { id: sources, label: "Источники", hint: "Источники — это те же агенты, только с другим типом задач: они собирают данные. Выключенный источник пропускается сбором.", enabled: true }
  - { id: creatives, label: "Креативы", hint: "Агенты для баннеров, текстов и креативов. Появятся позже.", enabled: false }
  - { id: analytics-agents, label: "Аналитики", hint: "Агенты для разбора данных и прогнозов. Появятся позже.", enabled: false }
