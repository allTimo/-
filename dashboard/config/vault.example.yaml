# ОБРАЗЕЦ СХЕМЫ выгрузки панели в Obsidian-vault.
#
# Рабочий файл — dashboard/config/vault.yaml (он и читается по умолчанию).
# Здесь только описание полей: значений боевого vault в образце нет.
#
# Схема:
#   version       — версия схемы конфига (сейчас 1)
#   vault_path    — АБСОЛЮТНЫЙ путь к корню vault; в двойных кавычках, обратный слэш удваивается
#   domains_dir   — каталог доменов внутри vault (по умолчанию "20-Домены")
#   export_subdir — имя подпапки выгрузки внутри каждого домена (по умолчанию "выгрузка-панели")
#   enabled       — false полностью выключает выгрузку (кроме явного opts.vaultPath в коде)
#
# Границы записи: модуль пишет только в
#   <vault_path>/<domains_dir>/<Домен>/<export_subdir>/<файл>.md
# Домены (русские папки): Агенты, Авторизация, Оплата, Расходы, Панель, Отчёты,
#   Инфраструктура, Коннекторы. В фронтматтер идёт латинский код домена:
#   agents | auth | billing | transactions | dashboard | reporting | infra | connectors.
# Любой путь вне этой зоны считается ошибкой — файл не пишется.
#
# Поведение:
#   • каталоги создаются при необходимости;
#   • существующий файл перед перезаписью копируется в <имя>.bak-<YYYYMMDD-HHmmss>;
#   • если содержимое не изменилось — файл не перезаписывается (skipped), .bak не создаётся;
#   • каждая заметка ≤ ~7 тыс. знаков, иначе делится на части «<имя>-часть-2.md» и т. д.;
#   • ключи доступа, токены, cookie, адреса туннелей (live-url.txt, last-url.txt)
#     и персональные данные (контакты, ФИО операторов) в выгрузку не попадают.
#
# Запуск:
#   node dashboard/collector/export-vault.mjs --dry-run
#   node dashboard/collector/export-vault.mjs --vault "C:\\путь\\к\\тестовому\\vault"

version: 1
vault_path: "C:\\Users\\<имя>\\Documents\\Obsidian Vault"
domains_dir: "20-Домены"
export_subdir: "выгрузка-панели"
enabled: true
