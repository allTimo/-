      - { id: vision-router, name: "Маршрутизатор картинок (Vision Router)", what: "Читать скриншоты и изображения без смены модели", direction: read, method: "плагин профиля", where: "включён; у поля ввода включить «Vision»", status: connected, package: dsh-vision-router }
      - { id: delegate-router, name: "Маршрутизатор подагентов (Delegate Router)", what: "Лёгкие задачи уходят на дешёвую модель", direction: both, method: "плагин профиля", where: "настроить flashModel/proModel в разделе «Настройки»", status: connected, package: dsh-delegate-router }
