# ПОЛНЫЙ КАТАЛОГ ИНТЕГРАЦИЙ: что можно подключить по API.
# Источник: marketing-agents/docs/integrations-catalog.md (перенесён сюда один в один).
# Правится вручную: добавьте запись в нужную группу — раздел «Интеграции» подхватит её.
#
# direction: read (читаем) | write (пишем) | both (оба)
# status:    connected (подключено) | available (можно подключить)
#            | partnership (требует партнёрства) | no-api (нет открытого API)
# package:   id пакета в профиле DSH — если он установлен и в бандлах, статус станет
#            «подключено» автоматически, по фактам, а не по обещаниям.
# key_env:   имя переменной окружения с ключом. Значение ключа панель НИКОГДА не читает,
#            показывает только «ключ есть / ключа нет».

version: 1
updated: "2026-10-31"

groups:
