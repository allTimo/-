H","file":null,"ownerUnknown":true,"revision":3,"description":"T21 — Вернуть КОНЦЕПЦИЮ: панель управления с тумблерами и сквозной аналитикой, удобная с телефона\n\nЗАМЕЧАНИЕ ПОЛЬЗОВАТЕЛЯ (важно): «ключевая функция — именно панель управления, чтобы были тумблеры и настройки включения/выключения, и сквозная аналитика по всей работе; визуально мы немного отошли от концепции».\nЗначит: дизайн, который он одобрил по первым скриншотам, — сохранить; мобильная версия не должна быть «урезанной витриной»; управление — на первом плане.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) СДЕЛАТЬ ЛОКАЛЬНУЮ ПАНЕЛЬ АДАПТИВНОЙ, не теряя вид: тот же тёмный стиль, те же карточки/плитки/графики, но на 390-430 px — одна колонка, крупные тапы, ничего не выезжает по горизонтали (проверить замером scrollWidth == clientWidth на 390 px). Это ТА ЖЕ страница (public/index.html + app.js) с медиа-запросами, а НЕ отдельная упрощённая сборка.\n2) УПРАВЛЕНИЕ — НА ПЕРВЫЙ ПЛАН. На вкладке «Агенты»:\n   - тумблер у каждого агента (уже есть) + счётчик «включено N из M»;\n   - групповые переключатели: «включить/выключить всех», «только активные», по группам из реестра;\n   - рядом с тумблером — что именно произойдёт (подсказка), и «последнее изменение: кто/когда» (из бэкапов .","descriptionFirstLine":"T21 — Вернуть КОНЦЕПЦИЮ: панель управления с тумблерами и сквозной аналитикой, удобная с телефона","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-22","subject":"T22: стабильная внешняя ссылка для живой панели с тумблерами","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793460332751,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T22 — СТАБИЛЬНАЯ внешняя ссылка для ЖИВОЙ панели управления (с тумблерами)\n\nКОНТЕКСТ: панел параметров; потом подумаем про онлайн-сервер».\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) ОДНА ВЕРСИЯ: единственный продукт — локальная панель (serve.mjs + public/). Автономный HTML, тильдовскую сборку и read-only публикацию перенеси в dashboard/_legacy/ (НЕ удалять, но убрать из README как способы запуска и не пересобирать). Скрипт запуска и README должны указывать ровно один способ: node marketing-agents/dashboard/serve.mjs -> http://127.0.0.1:8787.\n2) РУССКИЙ ЯЗЫК: убедись, что в UI нет ни одного не-русского фрагмента, включая подписи плагинов/моделей/статусов. Если у плагина русское название отсутствует — бери из registry/integrations-catalog.yaml или задай короткое русское имя в dashboard/config/ (например labels.yaml). Пометки статусов, кнопки, подсказки, ошибки — всё по-русски. Технические имена моделей (deepseek/deeps","descriptionFirstLine":"T24 — ОДНА версия панели под ПК + русский интерфейс + полный контроль параметров (тестовый режим)","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-25","subject":"T25: перевести иероглифы у skill-browser и delegate-router + разведка","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793461456138,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T25 — Убрать иероглифы из интерфейса: перевести подписи двух плагинов + полная разведка\n\nНАЙДЕНО ТОЧНО (Lead):\n- «技能浏览器» (Skill Browser, «браузер навыков») — marketing-agents... нет: C:\\Users\\Артем\\.dsh\\profiles\\desktop\\node_modules\\dsh-skill-browser\\lib\\client.js\n- «子代理模型分派记录» («записи о распределении моделей для подагентов») — C:\\Users\\Артем\\.dsh\\profiles\\desktop\\node_modules\\dsh-delegate-router\\lib\\client.js\nОбе строки лежат в JS в виде юникод-эскейпов (\\uXXXX), поэ ОВЩИК ЗАДАЧ Windows (он не привязан к DSH):\n   - скрипт install\\dashboard-task.ps1 с параметрами -Install / -Remove / -Status / -Run / -Logon <on|off>;\n   - -Install создаёт задачу с именем «DSH Dashboard» (действие: node marketing-agents\\dashboard\\serve.mjs, рабочий каталог — корень проекта), БЕЗ триггера (запуск по требованию) и создаёт ярлык на Рабочем столе «Панель управления.lnk», который вызывает -Run и открывает браузер;\n   - -Logon on добавляет триггер входа в систему и ПАУЗУ на 20 секунд (не включать без разрешения пользователя — только параметр);\n   - -Remove удаляет задачу и ярлык; -Status показывает состояние и слушает ли порт.\n2) install\\check-dashboard.ps1 — АВТОПРОВЕРКА (то, что требовал пользо","descriptionFirstLine":"T26 — Надёжный запуск панели + автопроверка перед стартом","writeScopes":["marketing-agents/install","marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-27","subject":"T27: русифицировать маркет плагинов, остальные UI и защитить языковой пакет","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793461587223,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T27 — Довести русификацию и защитить языковой пакет от вычищения\n\nКОНТЕКСТ: T23 и T25 закрыты. Пользователь просил «пусть будет на русском» — разрешение на перевод интерфейсов есть. Разведка (T25) показала, где ещё иероглифы.\n\nЧТО СДЕЛАТЬ (write-scope: профиль DSH, marketing-agents/install/**):\n1) ГЛАВНОЕ — dshmarket (интерфейс маркетплейса плагинов): ~2868 CJK-строк, но у плагина ЕСТЬ штатный механизм локалей (locale/zh.json, locale/en.json). Добавь locale/ru.json по образцу en.json (ключи те же, значения — русские) и зарегистрируй ru в списке локалей так, как это предусмотрено плагином (изучи его код; ничего не хардкодь в ие -> предлагаемый русский текст.\n3) Дополни перевод в проекте ru-locale (его translations\\*.json и/или собранный plugin\\locale\\ru.json) и ПЕРЕУСТАНОВИ пакет в профиль (установщик + проверка: строка locale-ru ровно одна, js-yaml strict OK, check-profile-bundles.mjs -> RESULT: OK).\n4) Если какие-то строки приходят из сторонних плагинов, а не из DSH — отнеси их в часть C.\n\nЧАСТЬ B — МЕНЮ VISION ROUTER НА РУССКОМ\n1) Найди строки ","descriptionFirstLine":"T28 — Русификация: меню Vision Router, остатки китайского и пропуски в языковом пакете DSH","writeScopes":["%USERPROFILE%/.dsh/profiles/desktop/node_modules/dsh-vision-router","%USERPROFILE%/.dsh/profiles/desktop/node_modules/dsh-skill-browser","%USERPROFILE%/.dsh/profiles/desktop/node_modules/dsh-delegate-router","%USERPROFILE%/.dsh/profiles/desktop/node_modules/dsh-serper-search","%USERPROFILE%/.dsh/profiles/desktop/node_modules/dsh-git-credentials","%USERPROFILE%/.dsh/profiles/desktop/node_modules/dsh-scrape-webpage","marketing-agents/install"],"blockedBy":[]},{"id":"task-29","subject":"T29: русифицировать интерфейс маркета плагинов (dshmarket)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"new","statusRaw":"pending","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793465019672,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T29 — Русификация интерфейса маркета плагинов (dshmarket)\n\nПОЛЬЗОВАТЕЛЬ: «в маркете плагины на английском — было бы здорово и это перевести».\n\nФАКТ (из T27): у dshmarket нет штатного i18n для интерфейса; ~1835 CJK-строк вшиты в client\\client.js + сотни сообщений в lib\\*.js (pnpm-compat ~230, routes ~242, dsh-cli ~91, verify ~72); файлы locale\\*.json — только метаданные каталога языков. Словарь настроек лежит внутри client.js (regions: zh/en/ja) и покрывает лишь раздел настроек маркета.\n\nЧТО СДЕЛАТЬ (write-scope: профиль node_modules\\dshmarket, marketing-agents/install/**):\n1) Бэкап ВСЕХ правимых файлов (client\\client.js, lib\\*.js) -> *.bak-ru-<timestamp>.\n2) Переведи в первую очередь ИНТЕРФЕЙС (то, что пользователь реально видит при обычной работе): заголовки и вкладки, кнопки (установить/обновить/удалить/подробнее), статусы (установлено/доступно/ошибка/загрузка), пустые состояния, подтверждения, текст тостов, подписи поиска и фильтров. Затем — сообщения об ошибках установки из lib\\*.js.\n3) ПОРЯДОК: разбей на разделы и после КАЖДОГО раздела — node --check правленых файлов + фиксация, что CJK в переведённых подписях = 0. Не делай всё одной массовой заменой.\n4) ЧЕГО НЕ ДЕЛАТЬ: не пер","descriptionFirstLine":"T29 — Русификация интерфейса маркета плагинов (dshmarket)","writeScopes":["%USERPROFILE%/.dsh/profiles/desktop/node_modules/dshmarket","marketing-agents/install"],"blockedBy":[]},{"id":"task-3","subject":"R3 (T28B+C): Vision Router + serper/git/scrape — ru-словари в реестрах локалей (ДО КОНЦА)","group":"Сборка системы","category":"Задачи команды","owner":"agent-1-competitor-watch","ownerLabel":"Агент 1 — Мониторинг конкурентов","ownerName":"data-engine","status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793466877984,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":false,"revision":8,"description":"ПОПРАВКА ПОДХОДА (тимлид; проверено Lead независимо 31.10): у трёх твоих плагинов ЕСТЬ штатный реестр локалей, и ru в нём отсутствует:\n- dsh-vision-router\\lib\\client.js: locale.register(NS, { zh, en })\n- dsh-serper-search\\lib\\client.js: locale.register(NS, { zh, en })\n- dsh-git-credentials\\lib\\client.js: locale.register(NS, { zh, en })\n(dsh-scrape-webpage: locale.register не найден — там строки литералами, переводить их.)\nПоэтому первым делом — добавить словарь ru с тем же набором ключей, что у en, и зарегистрировать его ({ zh, en, ru }), а не пе ый бэкенд.\n2) Предложи и настрой вариант с zvenoai: модель с приёмом изображений — z-ai/glm-5.3-flash (3,15/6,86 ₽ за 1 млн — дешёвая) либо openai/gpt-6-luna. Если у плагина есть свой keyless-бэкенд (OVH) — включи его как запасной и честно опиши ограничения (лимиты, данные уходят наружу).\n3) Обязательно предусмотри, что приватные скриншоты пользователя не должны уходить в бесплатный сторонний сервис без его ведома: по умолчанию выбери zvenoai (его аккаунт), а keyless-цепочку опиши как необязательную опцию.\n4) Проверь ФАКТИЧЕСКИ: настрой бэкенд, затем сделай тестовый вызов распознавания (можно на любом маленьком тестов","descriptionFirstLine":"T31 — Настроить визуальный бэкенд, чтобы картинки и скриншоты РЕАЛЬНО читались","writeScopes":["%USERPROFILE%/.dsh/profiles/desktop","marketing-agents/install"],"blockedBy":[]},{"id":"task-31","subject":"T32: внутренний аудит — что из плагинов и скилов реально работает","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"new","statusRaw":"pending","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793466299611,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T32 — ВНУТРЕННИЙ АУДИТ: какие плагины и скилы реально работают, а какие нет\n\nЦЕЛЬ: честная инвентаризация всей системы — что работает, что частично, что не работает и почему. БЕЗ установок и правок (только чтение + отчёт).\n\nЧТО ПРОВЕРИТЬ ПО КАЖДОМУ ПЛАГИНУ ПРОФИЛЯ (28 бандлов + установленные пакеты):\n1) есть ли в dsh.profile.bundles (загружается ли) и в dependencies;\n2) есть ли каталог в node_modules, точка входа (main/exports) и patch; парсится ли его cordis.patch.yml;\n3) требует ли ключей/настроек и есть ли они ФАКТИЧЕСКИ (только факт наличия, значения секретов не читать);\n4) ФУНКЦИОНАЛЬНАЯ ПРОБА: доступны ли инструменты плагина в текущей сессии и отвечают ли они; если у плагина есть свои тесты/self- сование, без реальных данных)","writeScopes":["marketing-agents/dashboard/mock"],"blockedBy":[]},{"id":"task-36","subject":"T37: каркас сервиса — клиенты, подписки, услуги, очередь, экономика","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793473734712,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":5,"description":"T37 — КАРКАС СЕРВИСА: модель данных и разделы панели под услуги (этап A)\n\nПОЛЬЗОВАТЕЛЬ: «действуем поэтапно: сначала собираем каркас сервиса, потом доделываем ботов, потом всё остальное». Это первый этап — читай marketing-agents\\docs\\MVP-service.md и panel-rework.md, дизайн — по docs\\design-reference-zveno.md (образец zveno.ai: монохром + акцент #7553ff, Inter/JetBrains Mono).\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**, marketing-agents/registry/**):\n1) МОДЕЛЬ ДАННЫХ (файлы в registry/, рядом с существующими agents.yaml/projects.yaml/sources.yaml):\n   - clients.yaml — клиенты: id, название, контакт, статус (лид/активен/пауза/ушёл), тариф, объекты[], подключённые услуги[], дата подключения, заметки;\n   - services.yaml — КАТАЛОГ УСЛУГ (3 услуги MVP): id, название, что делает, агент-исполнитель, расписание, что получает клиент (артефакты), себестоимость прогона (₽), цена клиенту, статус;\n   - subscriptions.yaml — подписки: клиент, услуга, тариф, период, дата начала/окончания, статус, цена, признак «счёт выставлен»;\n   - runs.jsonl — журнал прогонов (append): когда, услуга, клиент, агент, статус (ok/partial/failed), длительность, себестоимость ₽, путь к артефакту, текст о","descriptionFirstLine":"T37 — КАРКАС СЕРВИСА: модель данных и разделы панели под услуги (этап A)","writeScopes":["marketing-agents/dashboard","marketing-agents/registry"],"blockedBy":[]},{"id":"task-37","subject":"T38: обновить дизайн erLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793476894304,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T39 — БОКОВОЕ МЕНЮ НАВИГАЦИИ (левая панель) + новые разделы\n\nПОЛЬЗОВАТЕЛЬ: «нужно боковое меню навигации в левой стороне, где будут настройки, аккаунт, рабочее пространство, проекты и так далее, подключение оплат». Плюс просит мои варианты — они ниже.\n\nСТИЛЬ: как в docs\\design-reference-zveno.md (монохром, акцент #7553ff, Inter/JetBrains Mono, радиусы 8/12/16/24). Обязательно: активный пункт — акцентная полоса слева + лёгкая заливка тем же акцентом (10-12% прозрачности); наведение — едва заметное осветление фона; разделы — мелкие заголовки-группы (#737373, верхний регистр).\n\nСТРУКТУРА (реализовать ровно так):\nШапка панели:\n  • логотип + название сервиса;\n  • ПЕРЕКЛЮЧАТЕЛЬ РАБОЧЕГО ПРОСТРАНСТВА (выпадающий: «Личное» по умолчанию + возможность добавить);\n  • кнопка «+ Создать» (меню: клиент, услуга, задача, объект, счёт);\n  • поиск/командная палитра (Ctrl+K).\nГруппа «РАБОТА»: Обзор · Клиенты · Подписки и тарифы · Услуги · Очередь работ · Агенты · Объекты\nГруппа «АНАЛИТИКА»: Аналитика · Расходы · Экономика · Качество\nГруппа «СИСТЕМА»: Источники мониторинга · Интеграции · Оплаты · Уведомления · Состояние системы · Журнал\nГруппа «УПРАВЛЕНИЕ»: Рабочие пространства · Проекты · Команда и д","descriptionFirstLine":"T39 — БОКОВОЕ МЕНЮ НАВИГАЦИИ (левая панель) + новые разделы","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-39","subject":"T40: источники внутрь «Агентов», раздел «Результаты», кнопка темы","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793484098300,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T40 — Правки навигации: источники внутрь «Агентов», раздел «Результаты», кнопка темы\n\nТРИ ПРАВКИ ОТ ПОЛЬЗОВАТЕЛЯ (пункты 1, 3, 5):\n\n1) «ИСТОЧНИКИ МОНИТОРИНГА» ПЕРЕМЕСТИТЬ В ПОДПУНКТ «АГЕНТЫ» — логика пользователя: «это агенты просто с другим типом задач».\n   - В левом меню пункт «Источники мониторинга» убрать из группы «СИСТЕМА» и сделать вложенным подпунктом у «Агенты» (в группе «РАБОТА»).\n   - Внутри раздела «Агенты» сделать переключатель/две вкладки: «Агенты-исполнители» и «Агенты-источники» (второе — прежняя страница источников со всеми тумблерами, статистикой и журналом).\n   - Сохранить работу прямых ссылок: и #sources, и новый вложенный адрес должны открывать этот раздел (старые ссылки не ломать).\n\n3) В «АНАЛИТИКА» ДОБАВИТЬ ПОДПУНКТ «РЕЗУЛЬТАТЫ» — пространство, где фиксируется и показывается ФИНАЛЬНЫЙ РЕЗУЛЬТАТ работы агента:\n   - карточка результата: заголовок, что сделано (кратко), артефакты (ссылки на файлы отчёта), период, клиент/проект, исполнитель, время;\n   - ГЛАВНОЕ: «куда отправлено» — соцсеть/мессенджер/почта, дата и статус отправки (отправлено/ожидает/ошибка), канал: Telegram, VK, WhatsApp, Email, ссылка, скачивание;\n   - в MVP отправка выполняется вручную (или аге","descriptionFirstLine":"T40 — Правки навигации: источники внутрь «Агентов», раздел «Результаты», кнопка темы","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-4","subject":"T4: синхронизировать команды в runbook/README с фактическим CLI движка","group":"Сборка системы","category":"Задачи команды","owner":"agent-1-competitor-watch","ownerLabel":"Агент 1 — Мониторинг конкурентов","ownerName":"agent1-workspace","status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793387726787,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":false,"revision":6, :"T41 — Раздел «Интеграции»: полный каталог по API\n\nПОЛЬЗОВАТЕЛЬ (пункт 2): «в Интеграции добавить все возможные интеграции с CRM (амо, Битрикс, все популярные), Яндекс Метрикой, Яндекс Директом, ВК и всеми популярными рекламными каналами, системами сквозной аналитики, чтобы отдавать и передавать им данные — предложить людям все возможные интеграции, все, где можно подключиться по API».\n\nВХОД: marketing-agents\\docs\\integrations-catalog.md — там готовый каталог по группам (CRM; сквозная аналитика и коллтрекинг; рекламные каналы; веб-аналитика; каналы доставки; деньги и документы; данные о недвижимости; инфраструктура). Используй его как источник, ничего не выдумывая сверх.\n\nЧТО СДЕЛАТЬ:\n1) Переписать раздел «Интеграции» так, чтобы он показывал ВЕСЬ каталог: группы из документа, внутри — карточки записей.\n2) Каждая карточка: название, что даёт агенту (одна строка), направление (читаем/пишем/оба), способ (OAuth / API-ключ / выгрузка файлом), «где взять доступ», СТАТУС (подключено / можно подключить / требует партнёрства / нет открытого API), кнопка «Подключить» (честная заглушка «раздел в подготовке» либо ссылка на инструкцию).\n3) Фильтры и поиск по каталогу: по группе, по статусу, по н","descriptionFirstLine":"T41 — Раздел «Интеграции»: полный каталог по API","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-41","subject":"T43: три кликабельных макета дизайна (Пульт / Кабинет / Стекло)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793484098311,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T43 — Три кликабельных макета дизайна на выбор\n\nПОЛЬЗОВАТЕЛЬ (пункт 6): «предложи 3 варианта более современного дизайна сервиса, чтобы он был удобен с точки зрения UX и красивый, визуально приятно было находиться на нём».\n\nВХОД: marketing-agents\\docs\\design-variants.md — три направления с палитрами, типографикой, формой и движением.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/mock-design/**; рабочую панель НЕ трогать):\n1) Три отдельных статических макета в одной папке, каждый — свой файл: variant-1-pult.html, variant-2-kabinet.html, variant-3-glass.html. Данные вымышленные, но правдоподобные (3 клиента, 3 услуги, очередь, расходы).\n2) Одинаковая СТРУКТУРА во всех трёх (левое меню, шапка, KPI-плитки, карточки, таблица), чтобы различался именно ДИЗАЙН, а не состав.\n3) Каждый вариант строго по своему описанию:\n   - «Пульт»: тёмный, плотный, монохром + акцент #7553ff, Inter + JetBrains Mono, радиусы 10–14, минимум движения;\n   - «Кабинет»: светлый, воздушный, крупные заголовки и KPI, радиусы 16–24, мягкие тени, плавные появления;\n   - «Стекло»: тёмный с градиентными пятнами (#7553ff → #4fc1ff), полупрозрачные «стеклянные» панели, акцент-градиент, микроанимации.\n4) index.html ","descriptionFirstLine":"T43 — Три кликабельных макета дизайна на выбор","writeScopes":["marketing-agents/dashboard/mock-design"],"blockedBy":[]},{"id":"task-42","subject":"T44: «Агенты-исполнители» и «Агенты-источники» — отдельные пункты меню","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793485117911,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T44 — Навигация: «Агенты-исполнители» и «Агенты-источники» — отдельные пункты (без вложенности)\n\nПОЛЬЗОВАТЕЛЬ (пункт 1): «оставляем только агенты-исполнители и агенты-источники (далее новые группы будут добавляться так же), а вложенность убираем».\n\nЧТО СДЕЛАТЬ:\n1) В левом меню убрать вложенный подпункт. Сделать ДВА РАВНОПРАВНЫХ пункта верхнего уровня в группе «РАБОТА»: «Агенты-исполнители» и «Агенты-источники» (идут рядом, после «Услуг»).\n2) Внутри раздела «Агенты-исполнители» — только исполнители (текущая страница агентов). Внутри «Агенты-источники» — только источники (тумблеры сбора, статистика по снимкам, журнал запусков). Внутренний переключатель вкладок убрать.\n3) СТРУКТУРА ДОЛЖНА БЫТЬ ГОТОВА К РОСТУ: меню строится из списка разделов, где каждый пункт — независимая запись; добавить новый агентский раздел (например «Агенты-креативы», «Агенты-аналитики») должно быть возможно правкой одного файла-конфига, без правки логики. Опиши в README, как добавить новый раздел.\n4) Старые ссылки не ломать: #agents -> «Агенты-исполнители», #sources -> «Агенты-источники». Обе ссылки должны открывать свои страницы.\n5) Проверки как обычно (check-dashboard.ps1 — обнови список разделов, verify-data","descriptionFirstLine":"T44 — Навигация: «Агенты-исполнители» и «Агенты-источники» — отдельные пункты (без вложенности)","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-43","subject":"T45: Аналитика — больше графиков, срезов и метрик","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793485117916,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T45 — Аналитика: больше графиков, срезов и метрик\n\nПОЛЬЗОВАТЕЛЬ (пункт 2): «во вкладке аналитика не хватает графиков и больше разных срезов и метрик — сделай больше».\n\nЧТО СДЕЛАТЬ (раздел «Аналитика»):\n1) ГРАФИКИ (минимум 6, без внешних библиотек — SVG/canvas своими силами, как уже сделано):\n   • динамика по времени (линия/область) с переключением день/неделя/месяц;\n   • столбцы «доход / себестоимость / маржа» по неделям (накопительно);\n   • доли по услугам (кольцевая) и по клиентам (горизонтальные полосы);\n   • воронка «прогоны → результаты → отправлено клиенту»;\n   • тепловая карта активности (день недели × час) по прогонам;\n   • спарклайны внутри KPI-плиток (мини-тренд за 14 дней).\n2) СРЕЗЫ (переключатели над графиками): по времени, клиенту, услуге, агенту, источнику, каналу доставки, тарифу, проекту/ЖК, статусу.\n3) МЕТРИКИ (KPI-плитки, минимум 12): доход; себестоимость прогонов; маржа и маржинальность %; средний чек (ARPU по клиентам); прогонов всего; успешность %; среднее время прогона; расход токенов и ₽; стоимость одного прогона; результаты / отправлено / ожидает; доля ручной отправки; клиенты (активные / лиды / пауза); подписки (активные / истекают за 7 дней / просрочены); ","descriptionFirstLine":"T45 — Аналитика: больше графиков, срезов и метрик","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-44","subject":"T46: внедрить дизайн «Пульт» (оператор) и «Кабинет» (клиент)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793485117922,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T46 — Внедрить выбранный дизайн: «Пульт» для оператора, «Кабинет» для клиента\n\nРЕШЕНИЕ ПОЛЬЗОВАТЕЛЯ (пункт 3): «Вариант \"Пульт\" для панели оператора + \"Кабинет\" для кабинета клиента; \"Стекло\" — для посадочной страницы».\n\nЧТО СДЕЛАТЬ:\n1) ПАНЕЛЬ ОПЕРАТОРА — привести к оформлению «Пульт» (dashboard/mock-design/theme-1-pult.css как образец): тёмный #0a0a0a, поверхности #1a1a1a/#222, радиусы 10-14, теней почти нет, плотные строки, минимальное движение. Сохранить все текущие функции и разделы.\n2) ПОВЕРХНОСТЬ «КЛИЕНТ» (переключатель «Оператор / Клиент» в шапке) — оформить как «Кабинет» (theme-2-kabinet.css): светлый фон #f7f7f8, белые поверхности, радиусы 16-24, мягкие тени, крупные заголовки и KPI, плавные появления. Внутри — кабинет клиента: Мои услуги, Мои объекты, Отчёты, Результаты (с блоком «Куда отправлено»), Подписка и счета, Вопрос агенту. Это КАРКАС (реальных клиентов пока нет), но оформление — рабочее.\n3) Тема переключается вместе с поверхностью, но и вручную тоже работает: тёмная тема = «Пульт», светлая = «Кабинет».\n4) НЕ ЛОМАТЬ функции: все тумблеры, действия, параметры, экспорт, обратимость по SHA-256.\n5) Проверки: check-dashboard.ps1 (разделы не уменьшились), verify-data.mj","descriptionFirstLine":"T46 — Внедрить выбранный дизайн: «Пульт» для оператора, «Кабинет» для клиента","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-45","subject":"T47: посадочная страница сервиса в стиле «Стекло»","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793485117928,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T47 — Посадочная страница сервиса в стиле «Стекло» (лендинг)\n\nПОЛЬЗОВАТЕЛЬ: «стиль \"Стекло\" будем использовать для посадочной страницы/лендинг».\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/landing/**):\n1) Один файл-лендинг (или HTML+CSS+JS в папке landing/), стиль — «Стекло» (dashboard/mock-design/theme-3-glass.css как образец): глубокий фон #08080c, градиентные пятна #7553ff → #4fc1ff, полупрозрачные панели, свечение, аккуратные микроанимации.\n2) Структура лендинга (по образцу zveno.ai — мы его брали за референс):\n   • первый экран: что за сервис, для кого, главный результат, 2 кнопки («Попробовать», «Как это работает»);\n   • «Что вы получаете» — 3 услуги карточками (мониторинг конкурентов; настройка Яндекс Директа; размещение/аудит на площадках) с ценой и сроком;\n   • «Как это работает» — 4 шага;\n   • «Почему мы» — карточки преимуществ (агенты работают 24/7, отчёт в рублях и токенах до копейки, данные не уходят третьим лицам, интеграции с CRM и аналитикой);\n   • «Тарифы» — 3 тарифа (Старт / Бизнес / Премиум) с составом;\n   • «Интеграции» — логотипы-плашки из каталога (CRM, метрика, директ, VK, сквозная аналитика) — коротко, без простыни;\n   • «Вопросы» — 5-6 частых вопросов;\n   •","descriptionFirstLine":"T47 — Посадочная страница сервиса в стиле «Стекло» (лендинг)","writeScopes":["marketing-agents/landing"],"blockedBy":[]},{"id":"task-46","subject":"T48: раздел «Реклама и кэшбэк» — рекламные бюджеты и вознаграждение за ведение","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793485734699,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":7,"description":"T48 — Раздел «Реклама и кэшбэк»: рекламные бюджеты и вознаграждение за ведение\n\nЗАПРОС ПОЛЬЗОВАТЕЛЯ: «добавь раздел, чтобы можно было прогонять рекламные расходы и операторы получали за это кэшбэк с клиентов за ведение рекламы в Яндексе, ВК, Авито и так далее».\n\nСМЫСЛ: клиент ведёт рекламу через сервис; сервис (вы) фиксирует рекламные бюджеты и расходы по каналам и получает вознаграждение (кэшбэк) за ведение — в процентах от бюджета и/или фиксом.\n\nВАЖНО (юридическая рамка, обязательна к отображению в интерфейсе):\n- Схема «клиент платит площадке сам» (или со своего счёта), а мы получаем вознаграждение за услугу ведения — это чистая услуга, НПД подходит.\n- Схема «бюджет проходит через сервис» (мы получаем деньги клиента и оплачиваем площадки) — это агентская/комиссионная модель. Для НПД она НЕ подходит (ограничение закона 422-ФЗ: НПД не применяется к деятельности в интересах другого лица по договорам поручения/комиссии/агентским). Поэтому в интерфейсе у такой схемы должна быть честная плашка: «прогон бюджета через сервис требует ИП/ООО; при НПД выставляем вознаграждение за ведение».\n- Реализуй ОБА режима как переключатель, с плашкой про юр. последствия. Ничего не «прятать».\n\nЧТО СДЕЛ","descriptionFirstLine":"T48 — Раздел «Реклама и кэшбэк»: рекламные бюджеты и вознаграждение за ведение","writeScopes":["marketing-agents/dashboard","marketing-agents/registry"],"blockedBy":[]},{"id":"task-47","subject":"T49: трёхуровневая модель в «Рекламе и кэшбэке» — операторы и комиссия платформы","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793485958625,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T49 — Доработка раздела «Реклама и кэшбэк» под ТРЁХУРОВНЕВУЮ модель\n\nФАКТ (проверено Lead): раздел сделан по прежней, двухуровневой схеме (клиент → бюджет → кэшбэк клиенту). Уточнение пользователя пришло позже, поэтому НЕ реализовано:\n  • нет registry/operators.yaml (операторов как уровня нет);\n  • в интерфейсе нет понятий «ОБОРОТ», «КОМИССИЯ ПЛАТФОРМЫ», нет подписи «оборот — НЕ доход платформы»;\n  • кэшбэк считается клиенту, а по уточнению он должен идти ОПЕРАТОРАМ (пользователям платформы).\n\nМОДЕЛЬ (уточнена 01.11.2026): ПЛАТФОРМА (ИП) → ОПЕРАТОР (маркетолог/агентство — пользователь платформы) → КЛИЕНТ ОПЕРАТОРА (рекламодатель).\nДеньги: клиент платит платформе (бюджет + вознаграждение) → площадка (расход) + КЭШБЭК ОПЕРАТОРУ + КОМИССИЯ ПЛАТФОРМЫ. Доход платформы = комиссия + подписка, а НЕ оборот.\n\nЧТО СДЕЛАТЬ:\n1) registry/operators.yaml: id, имя, контакт, ставка кэшбэка % (с переопределением по каналу), статус, реквизиты договора, дата начала. Завести 3 демо-оператора. В clients.yaml добавить operator_id и связать демо-клиентов.\n2) Настройки платформы: ставка комиссии за сервис (глобальная, переопределение по клиенту и по каналу), правило округления, порог низкого остатка (уже ес","descriptionFirstLine":"T49 — Доработка раздела «Реклама и кэшбэк» под ТРЁХУРОВНЕВУЮ модель","writeScopes":["marketing-agents/dashboard","marketing-agents/registry"],"blockedBy":[]},{"id":"task-48","subject":"T50: Агент 1 (движок) — клиенты, площадки без логина, расписание, бренд-отчёт","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793529271285,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T50 — Агент 1 (движок): клиенты, площадки без логина, расписание, брендированный отчёт\n\nПОЛЬЗОВАТЕЛЬ: «план по агенту 1 — все пункты делаем; источники площадок недвижимости (Циан, Авито, Яндекс Недвижимость, Домклик и другие) реализуем так же, как аналитику по сайтам конкурентов — просто по ценам на странице проекта на сайте площадки, БЕЗ логина в кабинет».\n\n\nКОНТРАКТ КОНФИГА КЛИЕНТА (фиксирует Lead, менять нельзя без согласования):\nфайл marketing-agents\\01-competitor-watch\\config\\clients\\<client-id>.yaml\n  client_id: client-svet\n  name: \"ЖК «Свет»\"\n  brand: { logo: \"assets/logo.png\", accent: \"#7553ff\" }\n  schedule: { weekday: monday, time: \"10:00\" }\n  report: { title: \"Мониторинг конкурентов\", formats: [md, xlsx, pdf] }\n  recipients: [ { channel: telegram, address: \"@...\" }, { channel: email, address: \"...\" } ]\n  sources:\n    - { id: developer-sites, enabled: true }\n    - { id: cian,           enabled: true, mode: public-pages, auth: none }\n    - { id: avito,          enabled: true, mode: public-pages, auth: none }\n    - { id: yandex-realty,  enabled: true, mode: public-pages, auth: none }\n    - { id: domclick,       enabled: true, mode: public-pages, auth: none }\n  competitors:\n ","descriptionFirstLine":"T50 — Агент 1 (движок): клиенты, площадки без логина, расписание, брендированный отчёт","writeScopes":[" щадок, регламент","writeScopes":["marketing-agents/00-admin","marketing-agents/01-competitor-watch/README.md","marketing-agents/01-competitor-watch/templates","marketing-agents/01-competitor-watch/inbox","marketing-agents/registry/sources.yaml"],"blockedBy":[]},{"id":"task-5","subject":"V1: независимая проверка русификации и аудита","group":"Сборка системы","category":"Задачи команды","owner":"agent-1-competitor-watch","ownerLabel":"Агент 1 — Мониторинг конкурентов","ownerName":"data-engine","status":"new","statusRaw":"pending","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793466900383,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":false,"revision":7,"description":"Владелец: teammate verifier. НЕ доверять отчётам исполнителей — перепроверять файлы и команды самому.\n\nВАЖНОЕ УТОЧНЕНИЕ ПО ПРЕДМЕТУ ПРОВЕРКИ (по факту разведки Lead 31.10): у dshmarket, dsh-vision-router, dsh-serper-search, dsh-git-credentials ЕСТЬ штатный реестр локалей вида ctx.locale.register(NS, { zh, en[, ja] }), и правильная правка — добавление словаря ru с тем же набором ключей + регистрация. Поэтому НЕ требуй «CJK в файле = 0»: словари zh/ja обязаны остаться. Требуй:\n- ru присутствует в каждом реестре локалей этих плагинов;\n- набор ключей ru совпадает с en (missing=0, extra=0) — проверь своим скриптом, а не по отчёту;\n- в ru-значениях CJK = 0;\n- у dshmarket\\client\\client.js: 761 ключ ru (сверить с en);\n- у dsh-skill-browser своего реестра нет — проверить, что видимые подписи переведены и сопоставление ключевых слов не сломано.\n\nЧТО ПРОВЕРИТЬ:\n1) task-1 (языковой пакет): 8 ключей settings.agentPreset (guideStandardExplanation, guideStandardUsage, guidePtcExplanation, guidePtcUsage, guideMinimalExplanation, guideMinimalUsage, guideCordisExplanation, guideCordisUsage) — непустые русские строки Markdown и в ru-locale\\plugin\\lib\\client.js, И в профиле node_modules\\dsh-locale-ru\\","descriptionFirstLine":"Владелец: teammate verifier. НЕ доверять отчётам исполнителей — перепроверять файлы и команды самому.","writeScopes":["marketing-agents/audit/verification-of-ru-and-audit.md"],"blockedBy":["task-1","task-2","task-3","task-4","task-7","task-8"]},{"id":"task-50","subject":"T52: меню — одна категория «Агенты» с вкладками + фикс окон, попапов и меню пользователя","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793529271299,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T52 — Меню: убрать дубли по функционалу + починить окна, попапы и меню пользователя\n\nПОЛЬЗОВАТЕЛЬ (пункты 4 и 5): «оптимизировать боковое меню с точки зрения UX, чтобы не было дублей по функционалу — например, „Агенты-исполнители“ и „Агенты-источники“ собрать в одну категорию с внутренними вкладками, и далее дополнительные агенты по любым категориям будут размещаться здесь»; «доработать баги в меню с открытием окон и всплывающих окон, и в меню пользователя».\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) ОДНА КАТЕГОРИЯ «Агенты» с внутренними вкладками: Исполнители · Источники (+ место под будущие: Креативы, Аналитики). Вкладки — внутри раздела, не в боковом меню. Так меню перестаёт дублировать сущности.\n2) ГОТОВНОСТЬ К РОСТУ: список вкладок задаётся в конфиге (nav.yaml или отдельный agents-tabs.yaml), новая вкладка добавляется записью, без правки логики. В README — как добавить.\n3) ПРОВЕРИТЬ ВСЁ МЕНЮ НА ДУБЛИ: пройти по 27 разделам и убедиться, что нет двух пунктов с одним смыслом (например «Расходы» и «Экономика» — развести роли: расходы = токены и модели, экономика = деньги сервиса; «Состояние системы» и «Инфраструктура» — тоже развести или объединить). Предложить ","descriptionFirstLine":"T52 — Меню: убрать дубли по функционалу + починить окна, попапы и меню пользователя","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-51","subject":"T53: кошелёк и кэшбэк с любого оборота (модель click.ru) + предохранитель от убытка","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793529284357,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T53 — «Реклама и кэшбэк»: модель click.ru — единый кошелёк и кэшбэк с любого оборота\n\nКОНТЕКСТ: пользователь выбрал модель как у click.ru («пополнение через единый интерфейс с возвратом процента»), но с УТП: **нет минимального порога открутки, кэшбэк с любого оборота**. Финмодель и факты — в marketing-agents\\docs\\finance-model.md (прочитай).\n\nФАКТЫ ПО click.ru (для ориентира): «агрегатор площадок, делимся агентскими условиями»; возврат до 22% (Директ до 13%, соцсети до 19%, Telegram Ads до 7,8%) «при соблюдении условий партнёрской программы»; приветственный бонус 15% от первого пополнения; SEO бесплатно при пополнении от 50 000 ₽; отсрочка до 50 дней; один счёт и один общий акт.\n\nЧТО СДОБАВИТЬ В РАЗДЕЛ (write-scope: marketing-agents/dashboard/**, marketing-agents/registry/**):\n1) ЕДИНЫЙ КОШЕЛЁК клиента: одно пополнение → расход по всем площадкам → возврат → кэшбэк, в одном месте. Показать: пополнено, израсходовано по каналам, остаток, возврат от площадок, кэшбэк оператору, что осталось у платформы.\n2) ВОЗВРАТ ОТ ПЛОЩАДКИ как отдельная величина (факт, а не обещание): поле «ставка возврата по каналу» + фактически полученный возврат. Кэшбэк оператору считается ОТ ВОЗВРАТА, а не из воз","descriptionFirstLine":"T53 — «Реклама и кэшбэк»: модель click.ru — единый кошелёк и кэшбэк с любого оборота","writeScopes":["marketing-agents/dashboard","marketing-agents/registry"],"blockedBy":["task-50"]},{"id":"task-52","subject":"T54: Агент 2 «Яндекс Директ» — полная реализация (32 пункта плана)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"new","statusRaw":"pending","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793529284363,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":1,"description":"T54 — Агент 2 «Яндекс Директ»: реализация (после Агента 1)\n\nПЛАН ПОЛНОСТЬЮ: marketing-agents\\docs\\agent2-yandex-direct-plan.md (32 пункта, 7 этапов). Выгрузка — через API Директа.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/02-keywords-direct/**):\nЭтап 1: ТЗ-форма (YAML/JSON-схема) + валидация; описание доступов (OAuth Директа, Метрика, Wordstat); проверка посадочной (цели, скорость, мобильная версия); чек-лист юридической рамки (маркировка ERID, требования к рекламе застройщиков).\nЭтап 2: сбор семантики (Wordstat/подсказки/бренды/районы/метро/параметры/ипотека), чистка (минус-слова), лемматизация, дедупликация, кластеризация по интенту, оценка частотности и прогноз кликов и стоимости.\nЭтап 3: структура кампаний (Поиск/РСЯ), группы с одним интентом и своей посадочной, гео/время/устройства/корректировки, счётчик и цели, УТМ-разметка, импорт существующих кампаний.\nЭтап 4: генерация объявлений (2 заголовка, текст, быстрые ссылки, уточнения, промоакция) в лимитах Директа; креативы под РСЯ; проверка на модерацию; сдержанный тон для премиума.\nЭтап 5: выгрузка — XLS под Директ Коммандер И API Директа (создание кампаний/групп/ключей/объявлений в паузе, дневной лимит на старте); проверка ре","descriptionFirstLine":"T54 — Агент 2 «Яндекс Директ»: реализация (после Агента 1)","writeScopes":["marketing-agents/02-keywords-direct"],"blockedBy":["task-48","task-49"]},{"id":"task-53","subject":"T53: кошелёк и кэшбэк с любого оборота (модель click.ru) + предохранитель от убытка","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793529301023,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T53 — «Реклама и кэшбэк»: модель click.ru — единый кошелёк и кэшбэк с любого оборота\n\nКОНТЕКСТ: пользователь выбрал модель как у click.ru («пополнение через единый интерфейс с возвратом процента»), но с УТП: **нет минимального порога открутки, кэшбэк с любого оборота**. Финмодель и факты — в marketing-agents\\docs\\finance-model.md (прочитай).\n\nФАКТЫ ПО click.ru (ориентир): агрегатор площадок, делится агентскими условиями; возврат до 22% (Директ до 13%, соцсети до 19%, Telegram Ads до 7,8%) «при соблюдении условий партнёрской программы»; бонус 15% от первого пополнения; SEO бесплатно при пополнении от 50 000 ₽; отсрочка до 50 дней; один счёт и один общий акт.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**, marketing-agents/registry/**):\n1) ЕДИНЫЙ КОШЕЛЁК клиента: пополнение → расход по всем площадкам → возврат → кэшбэк, в одном месте. Показать: пополнено, израсходовано по каналам, остаток, возврат от площадок, кэшбэк оператору, что осталось платформе.\n2) ВОЗВРАТ ОТ ПЛОЩАДКИ — отдельная величина (факт): поле «ставка возврата по каналу» + фактически полученный возврат. Кэшбэк оператору считается ОТ ВОЗВРАТА.\n3) УТП В ИНТЕРФЕЙСЕ: надпись «кэшбэк с любого оборота — без минималь","descriptionFirstLine":"T53 — «Реклама и кэшбэк»: модель click.ru — единый кошелёк и кэшбэк с любого оборота","writeScopes":["marketing-agents/dashboard","marketing-agents/registry"],"blockedBy":["task-50"]},{"id":"task-54","subject":"T54: Агент 2 «Яндекс Директ» — полная реализация (32 пункта плана)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"new","statusRaw":"deleted","project":null,"due":null,"overdue":false,"source": "revision":3,"description":"T55 — КРИТИЧНО: вкладки «Агентов» уводят в «Обзор» (маршрутизация подвкладок)\n\nПОЛЬЗОВАТЕЛЬ: «в категории Агенты вкладки Исполнители · Источники · Креативы · Аналитики при клике перебрасывает в раздел Обзор, а пользователь должен оставаться в разделе, который выбрал».\n\nДИАГНОЗ LEAD (воспроизведено в браузере):\n  • GET #agents — раздел отрисовывается правильно: переключатель seg-switch и 4 кнопки (Исполнители / Источники / Креативы · скоро / Аналитики · скоро);\n  • GET #agents/sources — рендерится ОБЗОР («Требует внимания», «Действия»), seg-switch отсутствует, содержимого источников нет;\n  • то есть маршрутизатор не понимает путь вида «раздел/подвкладка» и МОЛЧА падает на «Обзор». Клик по вкладке меняет адрес на #agents/<id> — и пользователя выбрасывает из раздела.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) Научить разбор адреса подвкладкам: #agents/<tab-id> должен открывать раздел «Агенты» с активной вкладкой <tab-id>. Поддержать ВСЕ id из dashboard/config/agents-tabs.yaml (сейчас executors, sources, creatives, analytics-agents — и любые будущие, без правки логики).\n2) НЕ ПАДАТЬ НА ОБЗОР: если подвкладка неизвестна — остаться в разделе «Агенты», открыть первую до","descriptionFirstLine":"T55 — КРИТИЧНО: вкладки «Агентов» уводят в «Обзор» (маршрутизация подвкладок)","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-56","subject":"T56: тонкие настройки каждого агента в его карточке","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793530275958,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T56 — Тонкие настройки каждого агента внутри его карточки\n\nПОЛЬЗОВАТЕЛЬ: «здесь происходит основная настройка агентов — не только общий тумблер включения и выключения, но и дополнительные тонкие настройки в каждой карточке для корректировки работы агента».\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**, marketing-agents/registry/agent-settings/**):\n1) МОДЕЛЬ: настройки каждого агента — в отдельном файле registry/agent-settings/<agent-id>.yaml (схема в registry/README-agents-settings.md). Панель читает и правит их атомарно (temp+rename), с копией .bak-<timestamp>, обратимостью по SHA-256 и историей изменений («когда меняли»).\n2) В КАРТОЧКЕ АГЕНТА — раскрывающийся блок «Тонкие настройки» со полями, сгруппированными по смыслу. У КАЖДОГО поля: текущее значение, короткое «что произойдёт, если изменить», кнопка «вернуть как было» (последняя копия), валидация диапазона/типа.\n   Группы (общие для всех агентов):\n   • РАСПИСАНИЕ: дни недели, время, частота (ежедневно/еженедельно/ежемесячно), часовой пояс, «запускать только при новых данных».\n   • МОДЕЛЬ И РАСХОД: модель для агента (список из registry/prices.yaml с ценой в рублях рядом), лимит расхода ₽ в сутки/месяц, лимит токенов ","descriptionFirstLine":"T56 — Тонкие настройки каждого агента внутри его карточки","writeScopes":["marketing-agents/dashboard","marketing-agents/registry/agent-settings"],"blockedBy":[]},{"id":"task-57","subject":"T57: Агент 1 — автоподбор конкурентов по радиусу (движок)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793530879759,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T57 — Агент 1: автоподбор конкурентов по радиусу (движок)\n\nПОЛЬЗОВАТЕЛЬ: «надо поле в карточке, куда заполнить ЖК для наблюдения, а конкурентов он подберёт сам исходя из радиуса до 10 км, как это и заложено в настройках работы агента».\n\nКОНТРАКТ (полностью в marketing-agents\\docs\\agent1-competitor-discovery.md — прочитай):\n  agent1.watch: { project_id, name, address, url, coords: [lat, lon], geocode_source }\n  agent1.radius_km (по умолчанию 10) · agent1.segment: { classes: [...], price_per_m2_range: [min, max] }\n  agent1.auto_discover: true · agent1.discovery_sources: [cian, avito, yandex-realty, domclick, web-search]\n  agent1.max_candidates (20) · agent1.competitors (подтверждённые)\n\nЧТО СДЕЛАТЬ (write-scope: 01-competitor-watch/scripts/**, tests/**, data/**):\n1) ГЕОКОДИРОВАНИЕ своего ЖК: координаты из настроек; если пусто — определить по адресу (OSM/Nominatim как основной бесплатный вариант; поддержать вставку ключа Яндекс.Геокодера как опцию). Кэшировать результат в data/geocache.json, чтобы не дёргать сервис повторно. Если точность низкая — вернуть флаг и предупреждение, а не «примерные» координаты молча.\n2) ПОИСК КАНДИДАТОВ В РАДИУСЕ: обход публичных страниц площадок (БЕЗ логи","descriptionFirstLine":"T57 — Агент 1: автоподбор конкурентов по радиусу (движок)","writeScopes":["marketing-agents/01-competitor-watch/scripts","marketing-agents/01-competitor-watch/tests","marketing-agents/01-competitor-watch/data"],"blockedBy":[]},{"id":"task-58","subject":"T58: Агент 1 — поле «ЖК для наблюдения», радиус и разбор кандидатов в панели","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793530879765,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T58 — Агент 1: поле «ЖК для наблюдения», радиус и разбор кандидатов в панели\n\nПОЛЬЗОВАТЕЛЬ: «надо придумать поле в карточке, куда заполнить ЖК для наблюдения, а конкурентов он подберёт сам исходя из радиуса до 10 км».\n\nКОНТРАКТ: marketing-agents\\docs\\agent1-competitor-discovery.md (прочитай). Движок поиска делает data-engine в task-57; ты делаешь интерфейс и запись настроек.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**, registry/agent-settings/**):\n1) В карточке Агента 1 (блок «Тонкие настройки») — новая группа **«ЖК для наблюдения»**:\n   • Название ЖК (текст) · Адрес (текст) · Ссылка на сайт ЖК (необязательно);\n   • Координаты (необязательно, широта/долгота) + подпись «если пусто — агент определит по адресу»;\n   • **Радиус поиска конкурентов, км** (число, по умолчанию 10, диапазон 1–50);\n   • Класс/сегмент (мультивыбор: комфорт/бизнес/премиум/элит);\n   • Диапазон цены за м² (необязательно, от и до);\n   • Источники поиска (тумблеры: cian, avito, yandex-realty, domclick, web-search);\n   • Максимум кандидатов (число, по умолчанию 20).\n   У каждого поля — текущее значение, «что произойдёт», валидация, «вернуть как было» (как в остальных настройках).\n2) КНОПКА **«Подобрать ","descriptionFirstLine":"T58 — Агент 1: поле «ЖК для наблюдения», радиус и разбор кандидатов в панели","writeScopes":["marketing-agents/dashboard","marketing-agents/registry/agent-settings"],"blockedBy":[]},{"id":"task-59","subject":"T59: Агент 1 — расширенный профиль конкурента (метрики, ЕИСЖС, динамика)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793543458539,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T59 — Агент 1: расширенный профиль конкурента (метрики + ЕИСЖС/браузер + динамика)\n\nПОЛЬЗОВАТЕЛЬ: «добавить к агенту 1 дополнительные данные: лоты в реализации, цены, акции, цены по типам квартир, сколько корпусов сдано/строится, сколько продано по Росреестру, сколько забронировано» + «предложи свои идеи».\n\nКОНТРАКТ И ПОЛНЫЙ СПИСОК МЕТРИК: marketing-agents\\docs\\agent1-competitor-metrics.md — прочитай целиком, там и мои идеи (§3), и честные статусы источников (§1-2).\n\nЧТО СДЕЛАТЬ (write-scope: 01-competitor-watch/scripts/**, tests/**, data/**):\n1) ПРОФИЛЬ КОНКУРЕНТА: новый артефакт data\\clients\\<client-id>\\competitor-profiles\\<project>.json + _summary.json по схеме из документа. В профиле — все метрики с полями: значение, единица, источник, дата сбора, метод (http|dom|js-state|estimate), точность, комментарий.\n2) СОБИРАЕМ (проверенные источники): лоты в реализации; цены мин/медиана/макс ₽ и ₽/м²; цены по типам (студии/1/2/3/4+); акции; средняя и медианная площадь; брони — ЕСЛИ источник помечает («забронировано»); корпуса — с сайта застройщика (раздел корпусов/хода строительства), если публично.\n3) РОСРЕЕСТР/ЕИСЖС — отдельно и честно: наш.дом.рф и rosreestr.gov.ru из этой среды недос","descriptionFirstLine":"T59 — Агент 1: расширенный профиль конкурента (метрики + ЕИСЖС/браузер + динамика)","writeScopes":["marketing-agents/01-competitor-watch/scripts","marketing-agents/01-competitor-watch/tests","marketing-agents/01-competitor-watch/data"],"blockedBy":[]},{"id":"task-6","subject":"R4a (T29): русификация dshmarket lib\\routes.js (добить) — остальные lib-файлы у другого исполнителя","group":"Сборка системы","category":"Задачи команды","owner":"agent-1-competitor-watch","ownerLabel":"Агент 1 — Мониторинг конкурентов","ownerName":"data-engine","status":"new","statusRaw":"pending","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793467031356,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":false,"revision":4,"description":"ИЗМЕНЕНИЕ ОБЪЁМА (тимлид, 31.10 20:55): чтобы закончить быстрее, часть файлов передана второму исполнителю. ТВОЙ ОСТАТОК СУЖЕН ДО ОДНОГО ФАЙЛА:\n\nВЛАДЕЛЕЦ: market-lib-ru.\nТВОЙ ФАЙЛ: C:\\Users\\Артем\\.dsh\\profiles\\desktop\\node_modules\\dshmarket\\lib\\routes.js (455 КБ, 2867 CJK — самый крупный).\nУЖЕ СДЕЛАНО ТОБОЙ: pnpm-compat.js (CJK 3385 → 18, остаток — служебные строки regex-детектора «不是内部或外部命令»).\nВСЕ ОСТАЛЬНЫЕ lib\\*.js (dsh-cli, official-de
