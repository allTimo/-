ё в задачи реестра.\n\nАРТЕФАКТЫ (write-scope: marketing-agents/registry/intake/** и marketing-agents/registry/tasks/**):\n1) registry/intake/README.md — по-русски: куда что класть (inbox/audio — аудио/видео, inbox/text — готовые транскрипты и заметки), поддерживаемые форматы, как получить запись из Телемоста, лимиты, что делать если расшифровка не удалась.\n2) registry/intake/scripts/transcribe.* — расшифровка аудио в текст (русский).\n   ВАЖНО, сначала разведка: в системе уже есть локальный движок речи C:\\Users\\Артем\\.dsh\\speech-to-text\\sensevoice\\models и включён voice-input bundle. Выясни, есть ли CLI/скрипт для расшифровки ФАЙЛА (ищи в ресурсах DSH: app.asar.unpacked, node_modules, python-пакеты). Если локально нельзя — честно зафиксируй это и предложи рабочий обход: (а) расшифровка средствами самого Телемоста/Яндекс, (б) внешний ASR. НЕ выдумывай несущест","descriptionFirstLine":"T13 — Приём задач голосом из Яндекс Телемоста (без API у Телемоста)","writeScopes":["marketing-agents/registry/intake","marketing-agents/registry/tasks"],"blockedBy":[]},{"id":"task-14","subject":"T14: подключить Циан/Авито к Агенту 1 через Chrome CDP + реальный сбор","group":"Сборка системы","category":"Задачи команды","owner":"agent-1-competitor-watch","ownerLabel":"Агент 1 — Мониторинг конкурентов","ownerName":"agent1-workspace","status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793455525906,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":false,"revision":3,"description":"T14 — Подключить Циан и Авито к Агенту 1 (Chrome over CDP)\n\nКОНТЕКСТ: в маркете установлены скилы cian-connector и avito-connector (в каталоге сессии уже видны). Они требуют Chrome, запущенный с отладочным портом (CDP). Chrome найден: \"C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe\". Сейчас CDP не запущен (порт 9222 закрыт). Пользователь дал согласие на настройку.\n\nАРТЕФАКТЫ (wri ТЫ (write-scope: marketing-agents/dashboard/**, marketing-agents/install/**):\n\n1) ЛОКАЛЬНАЯ ВЕРСИЯ В ОДИН КЛИК (полный функционал, с тумблерами)\n   marketing-agents/dashboard/Открыть дашборд.cmd\n   - запускает serve.mjs ОТДЕЛЬНЫМ процессом так, чтобы он жил после закрытия консоли: Start-Process с -WindowStyle Hidden (НЕ фоновое задание агента);\n   - если порт уже занят — не падать, а просто открыть браузер на существующий сервер;\n   - открывает браузер на http://127.0.0.1:8787;\n   - пишет внятные сообщения по-русски; путь к node берёт из %USERPROFILE%\\.dsh\\dsh-runtimes\\... , с fallback на PATH;\n   - в конце: \"Дашборд запущен. Это окно можно закрыть.\"\n   Проверь фактически: двойной запуск, повторный запуск при живом сервере, ответ 200.\n\n2) АВТОНОМНАЯ ВЕРСИЯ БЕЗ СЕРВЕРА (всегда открывается, даже если нич","descriptionFirstLine":"T15 — Дашборд, которым можно пользоваться без терминала (2 версии + автозапуск)","writeScopes":["marketing-agents/dashboard","marketing-agents/install"],"blockedBy":[]},{"id":"task-16","subject":"T16: вкладки «Интеграции API» и «Источники мониторинга» с тумблерами и статистикой","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793459139615,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T16 — Дашборд: вкладки «Интеграции API» и «Источники мониторинга»\n\nВАЖНО: сначала закрой T15 (автономный HTML + .cmd), потом бери T16.\n\nКОНТРАКТЫ (Lead уже создал, читай их):\n- marketing-agents/registry/sources.yaml — источники мониторинга (id, name, enabled, kind, auth, status, priority, last_run, limits, howto, note). Тумблер правит enabled.\n- marketing-agents/registry/integrations-catalog.yaml — что МОЖНО подключить (id, name, kind, purpose, status_hint, key_env/package, where).\n\n1) ВКЛАДКА «ИНТЕГРАЦИИ API» — два блока:\n   A. «Подключено» — определяется ФАКТИЧЕСКИ, не по мнению: из профиля DSH (C:\\Users\\Артем\\.dsh\\profiles\\desktop\\package.json -> dsh.profile.bundles и dependencies) + проверка, что каталог пакета есть в node_modules и у него есть точка входа/патч (логику можно взять из marketing-agents/install/check-profile-bundles.mjs). Показывай: имя, версия, назначение (из каталога, если есть), статус загрузки (в бандлах / установлен но выключен), нужен ли ключ.\n   B. «Можно подключить» — из integrations-catalog.yaml минус уже подключённые: назначение, что даёт, как подключить (команда dsh plugin add или где взять ключ).\n   СЕКРЕТЫ: проверяй только ФАКТ наличия ключа (env-пере","descriptionFirstLine":"T16 — Дашборд: вкладки «Интеграции API» и «Источники мониторинга»","writeScopes":["marketing-agents/dashboard"],"blockedBy":["task-15"]},{"id":"task-17","subject":"T17: публичная тестовая страница дашборда (туннель, только чтение)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793459139620,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T17 — ПУБЛИЧНАЯ ТЕСТОВАЯ СТРАНИЦА дашборда (доступ с телефона)\n\nЦЕЛЬ: пользователь хочет открыть рабочий кабинет с телефона по ссылке из интернета. Публикуем ТОЛЬКО ЧТЕНИЕ, без возможности что-то переключить, и без секретов.\n\nБЕЗОПАСНОСТЬ (критично):\n- Публикуемая копия — статические файлы, БЕЗ серверного API (никаких /api/agents/toggle), без записи в файлы.\n- В публикуемой копии не должно быть ключей, путей к .credentials.yaml, содержимого реестра с чувствительными полями. Проверь поиском по публикуемой папке: ZVENOAI|SERPER|SANDBASE|TOKEN|credentials|password — не должно быть значений (упоминания «ключа нет/есть» — это булев флаг, допустимо).\n- В шапке страницы напиши крупно: «Тестовая копия • только просмотр • данные на <дата/время>».\n\nЧТО СДЕЛАТЬ:\n1) marketing-agents/install/publish/ — папка публикации: скрипт build-publish.mjs копирует статику дашборда (dashboard/public/**) в install/publish/site/ и заменяет обращения к /api/state на встроенный файл data/state.json (или использует автономный HTML из T15, если он уже собран). Никаких POST.\n2) Туннель: скачай cloudflared для Windows в marketing-agents/install/tools/cloudflared.exe (официальный релиз GitHub cloudflare/cloudflared","descriptionFirstLine":"T17 — ПУБЛИЧНАЯ ТЕСТОВАЯ СТРАНИЦА дашборда (доступ с телефона)","writeScopes":["marketing-agents/install"],"blockedBy":[]},{"id":"task-18","subject":"T18: источники — реальное вкл/выкл в сборе + журнал запусков","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793459139624,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T18 — Тумблеры источников должны реально влиять на сбор + журнал запусков\n\nПОЧЕМУ: пользователь просит вкладку «Источники мониторинга» с включением/выключением и статистикой. Тумблер обязан иметь последствия, иначе это картинка.\n\nКОНТРАКТ (Lead создал): marketing-agents/registry/sources.yaml — поле enabled. Скрипты сбора обязаны пропускать источники с enabled: false.\n\nЧТО СДЕЛАТЬ (write-scope: 01-competitor-watch/scripts/**, 01-competitor-watch/tests/**, 01-competitor-watch/data/**):\n1) scripts/sources_tool.py — CLI: list (таблица: id, enabled, status, last_run), enable <id>, disable <id>, status <id>.\n   - правка только своего поля в sources.yaml, атомарно (temp+rename), бэкап .bak-<timestamp>, комментарии и порядок строк сохраняются (как в мини-YAML дашборда — можно взять тот же подход, но реализуй у себя);\n   - повторный enable/disable идемпотентен; неизвестный id — понятная ошибка, код 1.\n2) scripts/log_source_run.py — добавляет запись в 01-competitor-watch/data/source-runs.jsonl:\n   {\"ts\":\"<ISO>\",\"source\":\"<id>\",\"status\":\"ok|partial|blocked|empty\",\"lots\":<N>,\"projects\":<N>,\"note\":\"...\"}\n   Требования: только добавление (append), один JSON в строке, устойчивость к параллельной ","descriptionFirstLine":"T18 — Тумблеры источников должны реально влиять на сбор + журнал запусков","writeScopes":["marketing-agents/01-competitor-watch/scripts","marketing-agents/01-competitor-watch/tests","marketing-agents/01-competitor-watch/data"],"blockedBy":[]},{"id":"task-19","subject":"T19: дашборд для Тильды — мобильная страница «Панель управления»","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793459691694,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T19 — Дашборд для Тильды (мобильная «Панель управления»)\n\nЦЕЛЬ: пользователь создал в Тильде страницу «Панель управления» и хочет видеть рабочий кабинет оттуда, в первую очередь С ТЕЛЕФОНА. Тильда публична в интернете — это заменяет туннель.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/tilda/**):\n1) dashboard/tilda/build-tilda.mjs — ГЕНЕРАТОР, собирает один файл dashboard/tilda/panel-tilda.html:\n   - автономный: стили и скрипты вшиты, данные вшиты как JS-объект (НЕ fetch, без сети);\n   - МОБИЛЬНЫЙ ПЕРВЫЙ: ширина 360-430 px без горизонтальной прокрутки, крупные тапы, карточки в одну колонку, таблицы -> компактные списки, график — упрощённая полоса/мини-бары;\n   - вкладки: Обзор, Агенты, Задачи, Источники, Расходы, Интеграции (те же данные, что в локальном дашборде);\n   - тумблеры НЕ пишут в файлы (нельзя со статичной страницы): показывают, что «управление доступно в локальной версии», и НЕ выглядят как рабочие;\n   - в шапке крупно: «Данные на <дата/время сборки> • только просмотр»;\n   - РАЗМЕР: цель <= 60 КБ итогового файла. Для этого собирай для Тильды ОБЛЕГЧЁННЫЙ набор данных (агрегаты + верхние строки таблиц), а не весь 178-КБ слепок; тяжёлые массивы округляй/обрезай, но","descriptionFirstLine":"T19 — Дашборд для Тильды (мобильная «Панель управления»)","writeScopes":["marketing-agents/dashboard/tilda"],"blockedBy":["task-16"]},{"id":"task-2","subject":"R2 (T29): русификация маркета dshmarket — ru-словарь в штатном реестре локалей (ДОВЕСТИ ДО КОНЦА)","group":"Сборка системы","category":"Задачи команды","owner":"agent-1-competitor-watch","ownerLabel":"Агент 1 — Мониторинг конкурентов","ownerName":"agent1-workspace","status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793466867113,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":false,"revision":8,"description":"ПОПРАВКА ПОДХОДА И ПРИЁМКИ (тимлид; факт сообщил market-ru, проверен Lead независимо, 31.10): у dshmarket ЕСТЬ штатный i18n. В client\\client.js: словари const zh = {...}, const en = {...}, const ja = {...} и строка ctx.locale.register(\"dsh-market\", { zh, en, ja }) (проверено: locale.register присутствует, addLanguage нет). Словаря ru НЕТ, поэтому при активной локали ru клиент падает на fallback \"en\" — именно поэтому пользователь видит маркет на английском.\n\nСЛЕДСТВИЕ ДЛЯ РАБОТЫ: правильная правка — добавить словарь ru с тем же набором ключей, что у en (761 ключ), и зарегистрировать { zh, en, ja, ru }. НЕ переводить ~13k инлайновых CJK-литералов внутри словарей zh/ja — это источник для китайской и японской локалей, их удаление сломает эти языки.\n\nВЛАДЕЛЕЦ: market-ru. ТВОЙ ФАЙЛ: C:\\Users\\Артем\\.dsh\\profiles\\desktop\\node_modules\\dshmarket\\client\\client.js (единственный). dshmarket\\lib\\*.js — задача task-6 (market-lib-ru), не трогать. Другие каталоги профиля не твои.\n\nЧТО СДЕЛАТЬ:\n1) Бэкап client.js -> client.js.bak-ru-<timestamp> перед первой правкой; бэкапы не удалять.\n2) Собрать ru-словарь: все 761 ключ en с русскими значениями. Переводить порциями, после КАЖДОЙ порции — node --chec","descriptionFirstLine":"ПОПРАВКА ПОДХОДА И ПРИЁМКИ (тимлид; факт сообщил market-ru, проверен Lead независимо, 31.10): у dshmarket ЕСТЬ штатный i18n. В client\\client.js: словари const zh = {...}, const en = {...}, const ja = {...} и строка ctx.locale.register(\"dsh-market\", { zh, en, ja }) (проверено: locale.register присутствует, addLanguage нет). Словаря ru НЕТ, поэтому при активной локали ru клиент падает на fallback \"en\" — именно поэтому пользователь видит маркет на английском.","writeScopes":["marketing-agents/install/README-ui-ru-translations.md","marketing-agents/install/ru-market-report.md"],"blockedBy":[]},{"id":"task-20","subject":"T20: согласовать профиль — убрать форс-пару, включить vision и delegate","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793459759606,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T20 — Привести профиль в СОГЛАСОВАННОЕ состояние (убрать поломанные форс-плагины, включить vision и delegate)\n\nПРОБЛЕМА, найденная по факту (dashboard-ui при проверке вкладки «Интеграции API»):\n- В dsh.profile.bundles НЕТ dsh-vision-router и dsh-delegate-router, хотя они установлены в dependencies. Значит они НЕ загружаются: пользователь не может отправлять картинки через vision-router, а дешёвый роутинг подагентов не работает.\n- В dependencies остались @opendsh/dsh-plugin-scheduled-tasks и dsh-creative-studio (форс-установка через --accept-risk), но их нет в bundles, а исключения остались в compatibility.json. Это несогласованное состояние: именно оно, вероятнее всего, и привело к тому, что при холодном старте 31.10 приложение срезало список бандлов с 30 до 2.\n\nЧТО СДЕЛАТЬ (write-scope: профиль + marketing-agents/install/**):\n1) БЭКАП: package.json, pnpm-lock.yaml, pnpm-workspace.yaml, compatibility.json, cordis.patch.yml -> *.bak-consistency-<timestamp>.\n2) УБРАТЬ форс-пару полностью и аккуратно: dsh plugin --profile desktop remove \"@opendsh/dsh-plugin-scheduled-tasks@0.2.4\" \"dsh-creative-studio@0.2.1\" (или pnpm remove в каталоге профиля). Затем убрать их версии из compatibility.","descriptionFirstLine":"T20 — Привести профиль в СОГЛАСОВАННОЕ состояние (убрать поломанные форс-плагины, включить vision и delegate)","writeScopes":["%USERPROFILE%/.dsh/profiles/desktop","marketing-agents/install"],"blockedBy":[]},{"id":"task-21","subject":"T21: панель управления — адаптив под телефон, тумблеры и сквозная аналитика","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793460332747,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T21 — Вернуть КОНЦЕПЦИЮ: панель управления с тумблерами и сквозной аналитикой, удобная с телефона\n\nЗАМЕЧАНИЕ ПОЛЬЗОВАТЕЛЯ (важно): «ключевая функция — именно панель управления, чтобы были тумблеры и настройки включения/выключения, и сквозная аналитика по всей работе; визуально мы немного отошли от концепции».\nЗначит: дизайн, который он одобрил по первым скриншотам, — сохранить; мобильная версия не должна быть «урезанной витриной»; управление — на первом плане.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) СДЕЛАТЬ ЛОКАЛЬНУЮ ПАНЕЛЬ АДАПТИВНОЙ, не теряя вид: тот же тёмный стиль, те же карточки/плитки/графики, но на 390-430 px — одна колонка, крупные тапы, ничего не выезжает по горизонтали (проверить замером scrollWidth == clientWidth на 390 tHostKeyChecking=no -R panel-agents:80:127.0.0.1:8787 serveo.net -> ожидаем https://panel-agents.serveo.net (закрепи осмысленный поддомен, например dsh-agents-<короткий-хэш>). Проверь фактически доступность снаружи (200) и что POST-тумблер проходит (с ключом).\n2) tuna.am (российски","descriptionFirstLine":"T22 — СТАБИЛЬНАЯ внешняя ссылка для ЖИВОЙ панели управления (с тумблерами)","writeScopes":["marketing-agents/install","marketing-agents/dashboard/config"],"blockedBy":[]},{"id":"task-23","subject":"T23: русифицировать интерфейс DSH + разведка иероглифов у плагинов","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793461001652,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T23 — Русифицировать интерфейс DSH (иероглифы) + разведка чужих подписей\n\nФАКТ (проверено Lead): в нашей панели иероглифов НЕТ (0 CJK-символов в dashboard/public/**, registry/integrations-catalog.yaml). Значит иероглифы, которые видит пользователь, — это интерфейс самого DSH и страницы настроек сторонних плагинов.\nПри этом на диске уже есть СОБРАННЫЙ русский языковой пакет: C:\\Users\\Артем\\Desktop\\DeepSeek Harness\\ru-locale (plugin\\lib\\client.js, plugin\\lib\\index.js, plugin\\locale\\ru.json, install\\apply-ru-locale.ps1), но в профиле он НЕ установлен (нет node_modules\\dsh-locale-ru и нет строки locale-ru в cordis.patch.yml).\n\nЧТО СДЕЛАТЬ (write-scope: профиль DSH + marketing-agents/install/**):\n1) БЭКАП: package.json, pnpm-lock.yaml, pnpm-workspace.yaml, cordis.patch.yml, compatibility.json -> *.bak-locale-<timestamp>.\n2) Прочитай install\\apply-ru-locale.ps1 и README/BRIEF проекта ru-locale. Сначала прогони -DryRun, проверь, что он собирается сделать (копирование в node_modules + строка в cordis.patch.yml + установка локали ru).\n3) eting-agents/install","marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-27","subject":"T27: русифицировать маркет плагинов, остальные UI и защитить языковой пакет","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793461587223,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T27 — Довести русификацию и защитить языковой пакет от вычищения\n\nКОНТЕКСТ: T23 и T25 закрыты. Пользователь просил «пусть будет на русском» — разрешение на перевод интерфейсов есть. Разведка (T25) показала, где ещё иероглифы.\n\nЧТО СДЕЛАТЬ (write-scope: профиль DSH, marketing-agents/install/**):\n1) ГЛАВНОЕ — dshmarket (интерфейс маркетплейса плагинов): ~2868 CJK-строк, но у плагина ЕСТЬ штатный механизм локалей (locale/zh.json, locale/en.json). Добавь locale/ru.json по образцу en.json (ключи те же, значения — русские) и зарегистрируй ru в списке локалей так, как это предусмотрено плагином (изучи его код; ничего не хардкодь в обход механизма). Если объём большой — переводи в первую очередь видимые разделы: заголовки, кнопки, статусы, пустые состояния, ошибки; остальное — честно перечисли в отчёте как непереведённое. ОБЯЗАТЕЛЬНО: бэкап файлов плагина до правок.\n2) ПАКЕТ ЛОКАЛИЗАЦИИ DSH (dsh-locale-ru 1.0.0) сейчас КОПИЙНЫЙ: любой dsh plugin/pnpm install вычищает node_modules\\dsh-locale-ru, а строка locale-ru в cordis.patch.yml остаётся -> риск, что профиль не стартует. Сделай установку устойчивой: объяви пакет реальной зависимостью через file: (например file:.plugin-sources/dsh-locale","descriptionFirstLine":"T27 — Довести русификацию и защитить языковой пакет от вычищения","writeScopes":["%USERPROFILE%/.dsh/profiles/desktop","marketing-agents/install"],"blockedBy":[]},{"id":"task-28","subject":"T28: меню Vision Router + пропуски языкового п ode_modules/dshmarket","marketing-agents/install"],"blockedBy":[]},{"id":"task-3","subject":"R3 (T28B+C): Vision Router + serper/git/scrape — ru-словари в реестрах локалей (ДО КОНЦА)","group":"Сборка системы","category":"Задачи команды","owner":"agent-1-competitor-watch","ownerLabel":"Агент 1 — Мониторинг конкурентов","ownerName":"data-engine","status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793466877984,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":false,"revision":8,"description":"ПОПРАВКА ПОДХОДА (тимлид; проверено Lead независимо 31.10): у трёх твоих плагинов ЕСТЬ штатный реестр локалей, и ru в нём отсутствует:\n- dsh-vision-router\\lib\\client.js: locale.register(NS, { zh, en })\n- dsh-serper-search\\lib\\client.js: locale.register(NS, { zh, en })\n- dsh-git-credentials\\lib\\client.js: locale.register(NS, { zh, en })\n(dsh-scrape-webpage: locale.register не найден — там строки литералами, переводить их.)\nПоэтому первым делом — добавить словарь ru с тем же набором ключей, что у en, и зарегистрировать его ({ zh, en, ru }), а не переводить литералы внутри словарей zh (это источник китайского языка, его удаление сломает zh).\n\nВЛАДЕЛЕЦ: plugins-ru. ТВОИ КАТАЛОГИ: dsh-vision-router, dsh-serper-search, dsh-git-credentials, dsh-scrape-webpage, плюс проверка фактом dsh-delegate-router. НЕ ТВОИ: dsh-skill-browser (task-7), dshmarket (task-2/6), dsh-locale-ru, остальные.\n\nПОРЯДОК:\nB1) dsh-vision-router — пользователь отдельно просил меню. Сначала ru-словарь и регистрация в lib\\client.js (то, что видно в меню/настройках), затем проверь остальные файлы (index.js, lib\\settings-ia-client-prelude.js, lib\\runtime-i18n.js, lib\\runtime-i18n-boundary.js, lib\\core-primitives.js, lib\\d","descriptionFirstLine":"ПОПРАВКА ПОДХОДА (тимлид; проверено Lead независимо 31.10): у трёх твоих плагинов ЕСТЬ штатный реестр локалей, и ru в нём отсутствует:","writeScopes":["marketing-agents/install/README-ui-ru-plugins.md","marketing-agents/install/ru-plugins-report.md"],"blockedBy":[]},{"id":"task-30","subject":"T31: настроить визуальный бэкенд Vision Router (чтобы читались скриншоты)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"new","statusRaw":"pending","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793465135387,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T31 — Настроить визуальный бэкенд, чтобы картинки и скриншоты РЕАЛЬНО читались\n\nФАКТ: пользователь прислал скриншот, но vision_describe вернул {\"ok\":false,\"code\":\"VISION_UNSUPPORTED_BACKEND\",\"reason\":\"No vision-capable backend is configured\"} — то есть плагин dsh-vision-router загружен, но у него не выбран бэкенд. Значит отправлять картинки пользователь по-прежнему не может.\n\nЧТО СДЕЛАТЬ (write-scope: профиль DSH, marketing-agents/install/**):\n1) Разберись, где dsh-vision-router хранит настройки (storages/патч профиля/файл настроек плагина) и как ШТАТНО задать визуальный бэкенд.\n2) Предложи и настрой вариант с zvenoai: модель с приёмом изображений — z-ai/glm-5.3-flash (3,15/6,86 ₽ за 1 млн — дешёвая) либо openai/gpt-6-luna. Если у плагина есть свой keyless-бэкенд (OVH) — включи его как запасной и честно опиши ограничения (лимиты, данные уходят наружу).\n3) Обязательно предусмотри, что приватные скриншоты пользователя не должны уходить в бесплатный сторонний сервис без его ведома: по умолчанию выбери zvenoai (его аккаунт), а keyless-цепочку опиши как необязательную опцию.\n4) Проверь ФАКТИЧЕСКИ: настрой бэкенд, затем сделай тестовый вызов распознавания (можно на любом маленьком тестов","descriptionFirstLine":"T31 — Настроить визуальный бэкенд, чтобы картинки и скриншоты РЕАЛЬНО читались","writeScopes":["%USERPROFILE%/.dsh/profiles/desktop","marketing-agents/install"],"blockedBy":[]},{ DSH","file":null,"ownerUnknown":true,"revision":7,"description":"T48 — Раздел «Реклама и кэшбэк»: рекламные бюджеты и вознаграждение за ведение\n\nЗАПРОС ПОЛЬЗОВАТЕЛЯ: «добавь раздел, чтобы можно было прогонять рекламные расходы и операторы получали за это кэшбэк с клиентов за ведение рекламы в Яндексе, ВК, Авито и так далее».\n\nСМЫСЛ: клиент ведёт рекламу через сервис; сервис (вы) фиксирует рекламные бюджеты и расходы по каналам и получает вознаграждение (кэшбэк) за ведение — в процентах от бюджета и/или фиксом.\n\nВАЖНО (юридическая рамка, обязательна к отображению в интерфейсе):\n- Схема «клиент платит площадке сам» (или со своего счёта), а мы получаем вознаграждение за услугу ведения — это чистая услуга, НПД подходит.\n- Схема «бюджет проходит через сервис» (мы получаем деньги клиента и оплачиваем площадки) — это агентская/комиссионная модель. Для НПД она НЕ подходит (ограничение закона 422-ФЗ: НПД не применяется к деятельности в интересах другого лица по договорам поручения/комиссии/агентским). Поэтому в интерфейсе у такой схемы должна быть честная плашка: «прогон бюджета через сервис требует ИП/ООО; при НПД выставляем вознаграждение за ведение».\n- Реализуй ОБА режима как переключатель, с плашкой про юр. последствия. Ничего не «прятать».\n\nЧТО СДЕЛ","descriptionFirstLine":"T48 — Раздел «Реклама и кэшбэк»: рекламные бюджеты и вознаграждение за ведение","writeScopes":["marketing-agents/dashboard","marketing-agents/registry"],"blockedBy":[]},{"id":"task-47","subject":"T49: трёхуровневая модель в «Рекламе и кэшбэке» — операторы и комиссия платформы","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793485958625,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T49 — Доработка раздела «Реклама и кэшбэк» под ТРЁХУРОВНЕВУЮ модель\n\nФАКТ (проверено Lead): раздел сделан по прежней, двухуровневой схеме (клиент → бюджет → кэшбэк клиенту). Уточнение пользователя пришло позже, поэтому НЕ реализовано:\n  • нет registry/operators.yaml (операторов как уровня нет);\n  • в интерфейсе нет понятий «ОБОРОТ», «КОМИССИЯ ПЛАТФОРМЫ», нет подписи «оборот — НЕ доход платформы»;\n  • кэшбэк считается клиенту, а по уточнению он должен идти ОПЕРАТОРАМ (пользователям платформы).\n\nМОДЕЛЬ (уточнена 01.11.2026): ПЛАТФОРМА (ИП) → ОПЕРАТОР (маркетолог/агентство — пользователь платформы) → КЛИЕНТ ОПЕРАТОРА (рекламодатель).\nДеньги: клиент платит платформе (бюджет + вознаграждение) → площадка (расход) + КЭШБЭК ОПЕРАТОРУ + КОМИССИЯ ПЛАТФОРМЫ. Доход платформы = комиссия + подписка, а НЕ оборот.\n\nЧТО СДЕЛАТЬ:\n1) registry/operators.yaml: id, имя, контакт, ставка кэшбэка % (с переопределением по каналу), статус, реквизиты договора, дата начала. Завести 3 демо-оператора. В clients.yaml добавить operator_id и связать демо-клиентов.\n2) Настройки платформы: ставка комиссии за сервис (глобальная, переопределение по клиенту и по каналу), правило округления, порог низкого остатка (уже ес","descriptionFirstLine":"T49 — Доработка раздела «Реклама и кэшбэк» под ТРЁХУРОВНЕВУЮ модель","writeScopes":["marketing-agents/dashboard","marketing-agents/registry"],"blockedBy":[]},{"id":"task-48","subject":"T50: Агент 1 (движок) — клиенты, площадки без логина, расписание, бренд-отчёт","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793529271285,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T50 — Агент 1 (движок): клиенты, площадки без логина, расписание, брендированный отчёт\n\nПОЛЬЗОВАТЕЛЬ: «план по агенту 1 — все пункты делаем; источники площадок недвижимости (Циан, Авито, Яндекс Недвижимость, Домклик и другие) реализуем так же, как аналитику по сайтам конкурентов — просто по ценам на странице проекта на сайте площадки, БЕЗ логина в кабинет».\n\n\nКОНТРАКТ КОНФИГА КЛИЕНТА (фиксирует Lead, менять нельзя без согласования):\nфайл marketing-agents\\01-competitor-watch\\config\\clients\\<client-id>.yaml\n  client_id: client-svet\n  name: \"ЖК «Свет»\"\n  brand: { logo: \"assets/logo.png\", accent: \"#7553ff\" }\n  schedule: { weekday: monday, time: \"10:00\" }\n  report: { title: \"Мониторинг конкурентов\", formats: [md, xlsx, pdf] }\n  recipients: [ { channel: telegram, address: \"@...\" }, { channel: email, address: \"...\" } ]\n  sources:\n    - { id: developer-sites, enabled: true }\n    - { id: cian,           enabled: true, mode: public-pages, auth: none }\n    - { id: avito,          enabled: true, mode: public-pages, auth: none }\n    - { id: yandex-realty,  enabled: true, mode: public-pages, auth: none }\n    - { id: domclick,       enabled: true, mode: public-pages, auth: none }\n  competitors:\n ","descriptionFirstLine":"T50 — Агент 1 (движок): клиенты, площадки без логина, расписание, брендированный отчёт","writeScopes":["marketing-agents/01-competitor-watch/scripts","marketing-agents/01-competitor-watch/tests","marketing-agents/01-competitor-watch/data","marketing-agents/01-competitor-watch/reports"],"blockedBy":[]},{"id":"task-49","subject":"T51: Агент 1 (контур) — конфиги клиентов, источники площадок, регламент","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793529271293,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T51 — Агент 1 (контур клиента): конфиги клиентов, источники площадок, регламент\n\nПОЛЬЗОВАТЕЛЬ: «план по агенту 1 — все пункты делаем»; источники площадок — по публичным стр айлы и команды самому.\n\nВАЖНОЕ УТОЧНЕНИЕ ПО ПРЕДМЕТУ ПРОВЕРКИ (по факту разведки Lead 31.10): у dshmarket, dsh-vision-router, dsh-serper-search, dsh-git-credentials ЕСТЬ штатный реестр локалей вида ctx.locale.register(NS, { zh, en[, ja] }), и правильная правка — добавление словаря ru с тем же набором ключей + регистрация. Поэтому НЕ требуй «CJK в файле = 0»: словари zh/ja обязаны остаться. Требуй:\n- ru присутствует в каждом реестре локалей этих плагинов;\n- набор ключей ru совпадает с en (missing=0, extra=0) — проверь своим скриптом, а не по отчёту;\n- в ru-значениях CJK = 0;\n- у dshmarket\\client\\client.js: 761 ключ ru (сверить с en);\n- у dsh-skill-browser своего реестра нет — проверить, что видимые подписи переведены и сопоставление ключевых слов не сломано.\n\nЧТО ПРОВЕРИТЬ:\n1) task-1 (языковой пакет): 8 ключей settings.agentPreset (guideStandardExplanation, guideStandardUsage, guidePtcExplanation, guidePtcUsage, guideMinimalExplanation, guideMinimalUsage, guideCordisExplanation, guideCordisUsage) — непустые русские строки Markdown и в ru-locale\\plugin\\lib\\client.js, И в профиле node_modules\\dsh-locale-ru\\","descriptionFirstLine":"Владелец: teammate verifier. НЕ доверять отчётам исполнителей — перепроверять файлы и команды самому.","writeScopes":["marketing-agents/audit/verification-of-ru-and-audit.md"],"blockedBy":["task-1","task-2","task-3","task-4","task-7","task-8"]},{"id":"task-50","subject":"T52: меню — одна категория «Агенты» с вкладками + фикс окон, попапов и меню пользователя","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793529271299,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T52 — Меню: убрать дубли по функционалу + починить окна, попапы и меню пользователя\n\nПОЛЬЗОВАТЕЛЬ (пункты 4 и 5): «оптимизировать боковое меню с точки зрения UX, чтобы не было дублей по функционалу — например, „Агенты-исполнители“ и „Агенты-источники“ собрать в одну категорию с внутренними вкладками, и далее дополнительные агенты по любым категориям будут размещаться здесь»; «доработать баги в меню с открытием окон и всплывающих окон, и в меню пользователя».\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) ОДНА КАТЕГОРИЯ «Агенты» с внутренними вкладками: Исполнители · Источники (+ место под будущие: Креативы, Аналитики). Вкладки — внутри раздела, не в боковом меню. Так меню перестаёт дублировать сущности.\n2) ГОТОВНОСТЬ К РОСТУ: список вкладок задаётся в конфиге (nav.yaml или отдельный agents-tabs.yaml), новая вкладка добавляется записью, без правки логики. В README — как добавить.\n3) ПРОВЕРИТЬ ВСЁ МЕНЮ НА ДУБЛИ: пройти по 27 разделам и убедиться, что нет двух пунктов с одним смыслом (например «Расходы» и «Экономика» — развести роли: расходы = токены и модели, экономика = деньги сервиса; «Состояние системы» и «Инфраструктура» — тоже развести или объединить). Предложить ","descriptionFirstLine":"T52 — Меню: убрать дубли по функционалу + починить окна, попапы и меню пользователя","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-51","subject":"T53: кошелёк и кэшбэк с любого оборота (модель click.ru) + предохранитель от убытка","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793529284357,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T53 — «Реклама и кэшбэк»: модель click.ru — единый кошелёк и кэшбэк с любого оборота\n\nКОНТЕКСТ: пользователь выбрал модель как у click.ru («пополнение через единый интерфейс с возвратом процента»), но с УТП: **нет минимального порога открутки, кэшбэк с любого обо ап 3: структура кампаний (Поиск/РСЯ), группы (один интент + своя посадочная), гео/время/устройства/корректировки, счётчик и цели, UTM, импорт существующих кампаний.\nЭтап 4: генерация объявлений (2 заголовка, текст, быстрые ссылки, уточнения, промоакция) в лимитах; креативы под РСЯ; проверка на модерацию; сдержанный тон для премиума.\nЭтап 5: выгрузка — XLS под Директ Коммандер И API Директа (создание в ПАУЗЕ, дневной лимит на старте); проверка результата загрузки, разбор отклонённого.\nЭтап 6: оптимизация — статистика через API, чистка ключ","descriptionFirstLine":"T54 — Агент 2 «Яндекс Директ»: реализация (после Агента 1)","writeScopes":["marketing-agents/02-keywords-direct"],"blockedBy":["task-48","task-49"]},{"id":"task-55","subject":"T55 (КРИТИЧНО): вкладки «Агентов» уводят в «Обзор» — починить маршрутизацию подвкладок","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793530275952,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T55 — КРИТИЧНО: вкладки «Агентов» уводят в «Обзор» (маршрутизация подвкладок)\n\nПОЛЬЗОВАТЕЛЬ: «в категории Агенты вкладки Исполнители · Источники · Креативы · Аналитики при клике перебрасывает в раздел Обзор, а пользователь должен оставаться в разделе, который выбрал».\n\nДИАГНОЗ LEAD (воспроизведено в браузере):\n  • GET #agents — раздел отрисовывается правильно: переключатель seg-switch и 4 кнопки (Исполнители / Источники / Креативы · скоро / Аналитики · скоро);\n  • GET #agents/sources — рендерится ОБЗОР («Требует внимания», «Действия»), seg-switch отсутствует, содержимого источников нет;\n  • то есть маршрутизатор не понимает путь вида «раздел/подвкладка» и МОЛЧА падает на «Обзор». Клик по вкладке меняет адрес на #agents/<id> — и пользователя выбрасывает из раздела.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) Научить разбор адреса подвкладкам: #agents/<tab-id> должен открывать раздел «Агенты» с активной вкладкой <tab-id>. Поддержать ВСЕ id из dashboard/config/agents-tabs.yaml (сейчас executors, sources, creatives, analytics-agents — и любые будущие, без правки логики).\n2) НЕ ПАДАТЬ НА ОБЗОР: если подвкладка неизвестна — остаться в разделе «Агенты», открыть первую до","descriptionFirstLine":"T55 — КРИТИЧНО: вкладки «Агентов» уводят в «Обзор» (маршрутизация подвкладок)","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-56","subject":"T56: тонкие настройки каждого агента в его карточке","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793530275958,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T56 — Тонкие настройки каждого агента внутри его карточки\n\nПОЛЬЗОВАТЕЛЬ: «здесь происходит основная настройка агентов — не только общий тумблер включения и выключения, но и дополнительные тонкие настройки в каждой карточке для корректировки работы агента».\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**, marketing-agents/registry/agent-settings/**):\n1) МОДЕЛЬ: настройки каждого агента — в отдельном файле registry/agent-settings/<agent-id>.yaml (схема в registry/README-agents-settings.md). Панель читает и правит их атомарно (temp+rename), с копией .bak-<timestamp>, обратимостью по SHA-256 и историей изменений («когда меняли»).\n2) В КАРТОЧКЕ АГЕНТА — раскрывающийся блок «Тонкие настройки» со полями, сгруппированными по смыслу. У КАЖДОГО поля: текущее значение, короткое «что произойдёт, если изменить», кнопка «вернуть как было» (последняя копия), валидация диапазона/типа.\n   Группы (общие для всех агентов):\n   • РАСПИСАНИЕ: дни недели, время, частота (ежедневно/еженедельно/ежемесячно), часовой пояс, «запускать только при новых данных».\n   • МОДЕЛЬ И РАСХОД: модель для агента (список из registry/prices.yaml с ценой в рублях рядом), лимит расхода ₽ в сутки/месяц, лимит токенов ","descriptionFirstLine":"T56 — Тонкие настройки каждого агента внутри его карточки","writeScopes":["marketing-agents/dashboard","marketing-agents/registry/agent-settings"],"blockedBy":[]},{"id":"task-57","subject":"T57: Агент 1 — автоподбор конкурентов по радиусу (движок)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793530879759,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T57 — Агент 1: автоподбор конкурентов по радиусу (движок)\n\nПОЛЬЗОВАТЕЛЬ: «надо поле в карточке, куда заполнить ЖК для наблюдения, а конкурентов он подберёт сам исходя из радиуса до 10 км, как это и заложено в настройках работы агента».\n\nКОНТРАКТ (полностью в marketing-agents\\docs\\agent1-competitor-discovery.md — прочитай):\n  agent1.watch: { project_id, name, address, url, coords: [lat, lon], geocode_source }\n  agent1.radius_km (по умолчанию 10) · agent1.segment: { classes: [...], price_per_m2_range: [min, max] }\n  agent1.auto_discover: true · agent1.discovery_sources: [cian, avito, yandex-realty, domclick, web-search]\n  agent1.max_candidates (20) · agent1.competitors (подтверждённые)\n\nЧТО СДЕЛАТЬ (write-scope: 01-competitor-watch/scripts/**, tests/**, data/**):\n1) ГЕОКОДИРОВАНИЕ своего ЖК: координаты из настроек; если пусто — определить по адресу (OSM/Nominatim как основной бесплатный вариант; поддержать вставку ключа Яндекс.Геокодера как опцию). Кэшировать результат в data/geocache.json, чтобы не дёргать сервис повторно. Если точность низкая — вернуть флаг и предупреждение, а не «примерные» координаты молча.\n2) П ать ","descriptionFirstLine":"T58 — Агент 1: поле «ЖК для наблюдения», радиус и разбор кандидатов в панели","writeScopes":["marketing-agents/dashboard","marketing-agents/registry/agent-settings"],"blockedBy":[]},{"id":"task-59","subject":"T59: Агент 1 — расширенный профиль конкурента (метрики, ЕИСЖС, динамика)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793543458539,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T59 — Агент 1: расширенный профиль конкурента (метрики + ЕИСЖС/браузер + динамика)\n\nПОЛЬЗОВАТЕЛЬ: «добавить к агенту 1 дополнительные данные: лоты в реализации, цены, акции, цены по типам квартир, сколько корпусов сдано/строится, сколько продано по Росреестру, сколько забронировано» + «предложи свои идеи».\n\nКОНТРАКТ И ПОЛНЫЙ СПИСОК МЕТРИК: marketing-agents\\docs\\agent1-competitor-metrics.md — прочитай целиком, там и мои идеи (§3), и честные статусы источников (§1-2).\n\nЧТО СДЕЛАТЬ (write-scope: 01-competitor-watch/scripts/**, tests/**, data/**):\n1) ПРОФИЛЬ КОНКУРЕНТА: новый артефакт data\\clients\\<client-id>\\competitor-profiles\\<project>.json + _summary.json по схеме из документа. В профиле — все метрики с полями: значение, единица, источник, дата сбора, метод (http|dom|js-state|estimate), точность, комментарий.\n2) СОБИРАЕМ (проверенные источники): лоты в реализации; цены мин/медиана/макс ₽ и ₽/м²; цены по типам (студии/1/2/3/4+); акции; средняя и медианная площадь; брони — ЕСЛИ источник помечает («забронировано»); корпуса — с сайта застройщика (раздел корпусов/хода строительства), если публично.\n3) РОСРЕЕСТР/ЕИСЖС — отдельно и честно: наш.дом.рф и rosreestr.gov.ru из этой среды недос","descriptionFirstLine":"T59 — Агент 1: расширенный профиль конкурента (метрики + ЕИСЖС/браузер + динамика)","wr dBy":[]},{"id":"task-61","subject":"T61: ЕИСЖС/Росреестр — официальные корпуса и ДДУ в профиле конкурента","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793544203280,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T61 — ЕИСЖС (наш.дом.рф) и Росреестр: официальные данные по корпусам и ДДУ\n\nКОНТЕКСТ: ты доказал, что оба домена ОТКРЫВАЮТСЯ через Chrome по CDP (наш.дом.рф 138 664 б, без логина). Сейчас в профиле sold_official_rosreestr = null с честной пометкой. Пора разобрать структуру и достать официальные цифры.\n\nЧТО НУЖНО ПОЛЬЗОВАТЕЛЮ (его слова): «сколько корпусов сдано, сколько строится, сколько квартир продано по общим данным из Росреестра».\n\nЧТО СДЕЛАТЬ (write-scope: 01-competitor-watch/scripts/**, tests/**, data/**):\n1) РАЗОБРАТЬ ПОИСК ЕИСЖС ПО ЖК: найти на наш.дом.рф карточку проекта (поиск по названию ЖК/застройщику/адресу), вытащить:\n   • объекты строительства (корпуса): количество, адрес, стадия (строится / введён в эксплуатацию), срок ввода, готовность %;\n   • количество квартир в проекте и по корпусам (общая площадь, число квартир);\n   • ДДУ (договоры долевого участия): количество зарегистрированных, если публикуется, и дату среза.\n2) Если структурированных ДДУ по проекту нет — зафиксировать честно, а не выдумывать: какие именно данные есть на странице и что из них можно взять.\n3) ПОДКЛЮЧИТЬ К ПРОФИЛЮ КОНКУРЕНТА: новые метрики (corpi_total, corpi_built, corpi_under_construction, f","descriptionFirstLine":"T61 — ЕИСЖС (наш.дом.рф) и Росреестр: официальные данные по корпусам и ДДУ","writeScopes":["marketing-agents/01-competitor-watch/scripts","marketing-agents/01-competitor-watch/tests","marketing-agents/01-competitor-watch/data","marketing-agents/docs"],"blockedBy":[]},{"id":"task-62","subject":"T62: корпуса и шахматка с сайтов застройщиков (вместо недоступного ЕИСЖС)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793544929729,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T62 — Корпуса и «шахматка» с сайтов застройщиков (официальные данные недоступны)\n\nКОНТЕКСТ: ЕИСЖС (наш.дом.рф) из этой сети НЕДОСТУПЕН — я проверил лично: страница не открывается вообще (0 байт), с флагом игнорирования сертификата сайт отвечает «отключён». Росреестр открывается, но данных по корпусам/ДДУ конкретного ЖК там нет. Поэтому официальный путь «продано по Росреестру» сейчас невозможен, и подменять его своими цифрами нельзя.\n\nЧТО МОЖНО СДЕЛАТЬ ВМЕСТО ЭТОГО (твоя задача):\n1) САЙТЫ ЗАСТРОЙЩИКОВ — публичные данные, которые там реально есть:\n   • раздел «корпуса» / «ход строительства» / «о ходе строительства»: количество корпусов, адрес, стадия (строится / введён в эксплуатацию), срок ввода, готовность % (где публикуется);\n   • «выбор квартир» / шахматка / фильтр подбора: количество лотов в продаже, проданные и забронированные квартиры (если сайт их помечает);\n   • страницы акций и ипотечных программ.\n   Методы: обычный HTTP; если цены/шахматка подгружаются скриптами — Chrome по CDP без логина; искать JS-состояние страницы (window.__INITIAL_STATE__, __NEXT_DATA__, self.__next_f и подобное) — приём уже отработан на других площадках.\n2) Метрики в профиль конкурента: corpi_total, ","descriptionFirstLine":"T62 — Корпуса и «шахматка» с сайтов застройщиков (официальные данные недоступны)","writeScopes":["marketing-agents/01-competitor-watch/scripts","marketing-agents/01-competitor-watch/tests","marketing-agents/01-competitor-watch/data"],"blockedBy":[]},{"id":"task-63","subject":"T63: блок Агента 1 — показать корпуса, стройку, акции, шахматку и официальные метрики","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793545372363,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T63 — Блок Агента 1 в «Аналитике»: показать новые метрики (корпуса, стройка, акции, шахматка, официальные)\n\nКОНТЕКСТ: движок добавил в профили конкурентов новые метрики, но панель их не показывает — я проверил: в блоке нет ни «корпус», ни «СКИДКА», ни «сайт застройщика», при этом «данных нет» стало 46 (было 26), то есть часть метрик уже отображается как отсутствующая, а новые не отрисованы.\n\nЧТО ДОБАВИТЬ В БЛОК (write-scope: marketing-agents/dashboard/**):\n1) Группа «КОРПУСА И СТРОЙКА» (источник: сайт застройщика, метод dom):\n   • корпусов названо (у ЖК Михалковский — 7), сроки ввода (4 кв 2027), готовность % (если публикуется);\n   • стадии: сдано / строится — если сайт помечает;\n   • где шахматка публикуется: всего квартир / в продаже / продано / забронировано;\n   • derived «доля проданного (по сайту застройщика)» — показывать ТОЛЬКО когда есть оба числа, с явной подписью «не Росреестр».\n2) Группа «АКЦИИ И ПРОГРАММЫ» (источник: сайт застройщика): тексты акций (например «СКИДКА ДО 8%», «РАССРОЧКА 0%») и число ипотечных программ. Отличать от счётчика акций площадки.\n3) Группа «ОФИЦИАЛЬНЫЕ ДАННЫЕ: РОСРЕЕСТР / ЕИСЖС» — отдельно и честно: статус источника (сейчас «ЕИСЖС недоступен: сай","descriptionFirstLine":"T63 — Блок Агента 1 в «Аналитике»: показать новые метрики (корпуса, стройка, акции, шахматка, официальные)","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-64","subject":"T64: Аналитика — динамичные вложенные блоки отчёта Агента 1 + больше метрик","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793545514552,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T64 — «Аналитика»: динамичные вложенные блоки отчёта Агента 1 + больше метрик\n\nПОЛЬЗОВАТЕЛЬ: «в блоке, куда агент заполняет свой отчёт, нужно сделать блоки динамичные, с вложенностями и группировками и добавить больше метрик».\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) ПЕРЕСТРОИТЬ БЛОК в иерархию раскрывающихся групп (аккордеон), состояние раскрытия запоминается:\n   • Сводка (KPI: проектов, лотов, медианы, акций, флагов, дата и себестоимость прогона);\n   • Конкуренты (таблица + карточка каждого конкурента);\n   • └ Цены (медианы, мин/макс, ₽/м², разрез по типам квартир, индексы к району);\n   • └ Продукт (средняя/медианная площадь, структура по комнатности, сдвиги);\n   • └ Корпуса и стройка (корпусов, стадии, сроки ввода, готовность, шахматка);\n   • └ Акции и программы (тексты, число ипотечных программ, длительность);\n   • └ Динамика (скорость продаж, absorption, прогноз распродажи, Δ цены входа и предложения);\n   • └ Маркетинг (бюджеты по отчётности, факт поисковой рекламы, промо-активность, соцсети);\n   • └ Обращения и визиты (звонки/конверсия/визиты — «данных нет: источник не публикует», без цифр);\n   • └ Официальные данные (Росреестр/ЕИСЖС — отдельно, со статус","descriptionFirstLine":"T64 — «Аналитика»: динамичные вложенные блоки отчёта Агента 1 + больше метрик","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-65","subject":"T65: маркетинговые бюджеты конкурентов + обращения/визиты/конверсия (открытые источники)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793545514559,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T65 — Маркетинговые бюджеты конкурентов + обращения/визиты/конверсия (только из открытых источников)\n\nПОЛЬЗОВАТЕЛЬ: «добавить в анализ маркетинговые бюджеты этих проектов — всё, что можно взять из открытых источников, и данные по количеству звонков, конверсии и количеству визитов в офис продаж, если есть где-то; если нет — не выдумывать».\n\nКОНТРАКТ: docs/agent1-competitor-metrics.md §6 (прочитай — там и источники, и правило честности).\n\nЧТО СДЕЛАТЬ (write-scope: 01-competitor-watch/scripts/**, tests/**, data/**):\n1) МАРКЕТИНГОВЫЕ БЮДЖЕТЫ — собрать то, что реально есть:\n   • финансовая отчётность публичных застройщиков (ПИК, ЛСР, Самолёт, Etalon и др.): коммерческие расходы / расходы на рекламу и продвижение за период — с прямой ссылкой на документ, страницей и датой; помечать уровень данных («по группе/компании», не по ЖК);\n   • факт поисковой рекламы по бренду: есть ли объявления Директа по названию ЖК/застройщика (фиксируем ФАКТ, не сумму);\n   • промо-интенсивность (уже есть акции) и активность соцсетей/Telegram (частота публикаций, открытые метрики).\n   Метрики: marketing_spend_company_period, marketing_source_url, marketing_level, search_ads_present, social_posts_per_month — с ","descriptionFirstLine":"T65 — Маркетинговые бюджеты конкурентов + обращения/визиты/конверсия (только из открытых источников)","writeScopes":["marketing-agents/01-competitor-watch/scripts","marketing-agents/01-competitor-watch/tests","marketing-agents/01-competitor-watch/data"],"blockedBy":[]},{"id":"task-66","subject":"T66: продажи — простые маршруты к Росреестру/ЕИСЖС и открытым данным ДОМ.РФ","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793545514565,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T66 — Продажи: максимально простой путь к данным Росреестра/ЕИСЖС (приоритет пользователя)\n\nПОЛЬЗОВАТЕЛЬ: «по Росреестру супер, основная задача — вытащить как можно больше данных максимально простым способом; самые важные данные — это продажи».\n\nКОНТЕКСТ: наш.дом.рф из этой сети недоступен (Chrome отдаёт 0 байт; с игнорированием сертификата сайт отвечает «отключён»), rosreestr.gov.ru открывается, но данных по корпусам/ДДУ конкретного ЖК там нет. Код разбора карточки ЕИСЖС уже написан и покрыт тестами.\n\nЧТО СДЕЛАТЬ (write-scope: 01-competitor-watch/scripts/**, tests/**, data/**, docs/**):\n1) ИСКАТЬ ПРОСТЫЕ МАРШРУТЫ К ПРОДАЖАМ (сначала дешёвые, потом сложные):\n   • альтернативные хосты и API-эндпоинты ЕИСЖС (в т.ч. те, что отдают JSON: …/сервисы/api/…), проверять обычным HTTP и через Chrome;\n   • мобильные/упрощённые версии и открытые наборы данных ДОМ.РФ (порталы открытых данных, аналитика ДОМ.РФ) — что публично;\n   • проверка доступности через разные схемы соединения (HTTP/HTTPS, разные User-Agent, IPv4/IPv6) — фиксировать, что именно мешает;\n   • проверить, не отдаёт ли продажи сам сайт застройщика в шахматке (уже реализуется в developer_site) — приоритетно, потому что это самый п","descriptionFirstLine":"T66 — Продажи: максимально простой путь к данным Росреестра/ЕИСЖС (приоритет пользователя)","writeScopes":["marketing-agents/01-competitor-watch/scripts","marketing-agents/01-competitor-watch/tests","marketing-agents/01-competitor-watch/data","marketing-agents/docs"],"blockedBy":[]},{"id":"task-67","subject":"T67: маркетинговые бюджеты конкурентов из SpyWords/Keys.so (API + CSV)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793546047421,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T67 — Маркетинговые бюджеты конкурентов из SpyWords / Keys.so (API + импорт выгрузок)\n\nРЕШЕНИЕ ПОЛЬЗОВАТЕЛЯ: «оттуда брать маркетинговые бюджеты» (речь о SpyWords и Keys.so).\n\nФАКТЫ, ПРОВЕРЕННЫЕ LEAD:\n  • Keys.so — публичная документация API: https://apidoc.keys.so. Есть методы по КОНТЕКСТНОЙ РЕКЛАМЕ: «Контекстная реклама», «Контекстная реклама — конкуренты», «— ключевые слова», «— объявления», «— ключевые слова по объявлению», архивы по месяцам; плюс «Групповые отчёты» (создание отчёта, статус, домены в отчёте). Авторизация — по токену. Тарифы: https://www.keys.so/ru/tarif.\n  • SpyWords — API: https://spywords.ru/api_start.php (доступ по токену, часть за логином) и ОФИЦИАЛЬНЫЙ MCP-СЕРВЕР для ИИ-агентов: https://spywords.ru/ai-integrations.php («Данные SpyWords прямо в вашем ИИ-агенте», подключение через кабинет). Тарифы: https://spywords.ru/pricing.php.\n  • Наша система УЖЕ поддерживает MCP: в профиле есть плагин ru-marketplace-mcp-dsh, MCP-строки описываются в cordis.patch.yml через @deepseek-ai/dsh-mcp-client (transport stdio, command/args). То есть MCP SpyWords подключается как строка конфигурации.\n  • ВАЖНО про стоимость: смонтированный MCP-сервер оплачивается токенами НА КАЖД","descriptionFirstLine":"T67 — Маркетинговые бюджеты конкурентов из SpyWords / Keys.so (API + импорт выгрузок)","writeScopes":["marketing-agents/01-competitor-watch/scripts","marketing-agents/01-competitor-watch/tests","marketing-agents/01-competitor-watch/data","marketing-agents/01-competitor-watch/config","marketing-agents/01-competitor-watch/inbox"],"blockedBy":[]},{"id":"task-68","subject":"T68: панель — показ бюджетов конкурентов в группе «Маркетинг»","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793546047428,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T68 — Панель: показ маркетинговых бюджетов конкурентов (группа «Маркетинг»)\n\nКОНТЕКСТ: группа «Маркетинг» в блоке Агента 1 уже есть и помечена «движок ещё не собирает». Движок в task-67 добавляет метрики бюджетов из SpyWords/Keys.so.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) В группе «Маркетинг» показать по каждому конкуренту: ориентировочный бюджет за период (₽), период, число объявлений, число ключевых слов, число уникальных посадочных, источник (Keys.so | SpyWords), метод (api | csv | mcp), дату сбора и точность.\n2) ОБЯЗАТЕЛЬНАЯ ПОДПИСЬ: «ориентировочный бюджет по данным <сервис> — оценка сервиса, не фактический расход» (и слово «оценка» в бейдже метрики). Это ключевое требование честности.\n3) Состояния: ключ не задан → «Ключ API не подключён: бюджет появится после подключения SpyWords/Keys.so»; нет данных по домену → «нет данных по домену в базе сервиса»; иначе — таблица. Никаких нулей вместо отсутствия.\n4) Динамика бюджетов: мини-график или столбики по неделям (из срезов data/clients/<id>/budgets/<дата>.json), с той же подписью «оценка».\n5) Добавить новые ключи в карту имён и в группы отображения (правило полноты 35/35/0 должно остаться зелёным), скриншот 1","descriptionFirstLine":"T68 — Панель: показ маркетинговых бюджетов конкурентов (группа «Маркетинг»)","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-69","subject":"T69: подготовить коннектор Циан/Авито (uv, клон, обёртка запуска без MCP)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793546147021,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T69 — Подготовить коннектор Циан/Авито (ru-marketplace-mcp): uv, клон, проверка, запуск без монтирования MCP\n\nРЕШЕНИЕ ПОЛЬЗОВАТЕЛЯ: подключаем коннектор как ДОПОЛНИТЕЛЬНЫЙ источник для Агента 1.\n\nЧТО ЕСТЬ СЕЙЧАС (проверено Lead):\n  • в профиле установлен плагин ru-marketplace-mcp-dsh (skills: cian-connector, avito-connector и др.), MCP-строки в cordis.patch.yml через @deepseek-ai/dsh-mcp-client (transport stdio);\n  • MCP-строки ЗАДИСЕЙБЛЕНЫ до установки переменной RU_MARKETPLACE_MCP_DIR («All MCP rows stay disabled until RU_MARKETPLACE_MCP_DIR is set. Once enabled they are paid on EVERY request»);\n  • uv — НЕ УСТАНОВЛЕН; локального клона репозитория НЕТ; переменная не задана;\n  • README плагина: установка = git clone https://github.com/Vladimir-Human/ru-marketplace-mcp.git → uv sync --frozen → задать RU_MARKETPLACE_MCP_DIR → перезапуск профиля. Требования: Python ≥3.12, uv.\n  • ВАЖНО ПРО ДЕНЬГИ: смонтированный MCP оплачивается токенами на каждом запросе (схемы инструментов висят в контексте: ~2.2k токенов для compare-mcp, ~2.4k для decision-mcp, ~17.5k для полного marketplace-mcp). Поэтому монтировать его постоянно НЕ надо.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/install/**, ma","descriptionFirstLine":"T69 — Подготовить коннектор Циан/Авито (ru-marketplace-mcp): uv, клон, проверка, запуск без монтирования MCP","writeScopes":["marketing-agents/install","marketing-agents/connectors"],"blockedBy":[]},{"id":"task-7","subject":"R5 (T28B2): русификация dsh-skill-browser (правила+подписи, до конца)","group":"Сборка системы","category":"Задачи команды","owner":"agent-1-competitor-watch","ownerLabel":"Агент 1 — Мониторинг конкурентов","ownerName":"verifier","status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793467031363,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":false,"revision":4,"description":"ПОПРАВКА ПОДХОДА (тимлид, проверено Lead независимо 31.10): механизм локализации dsh-skill-browser ОТЛИЧАЕТСЯ от других on":3,"description":"T71 — История цен по НАШИМ конкурентам: связать HTTP-сбор с коннектором через offer_id\n\nКОНТЕКСТ (факт от data-engine, реальный прогон): коннектор работает — cian_search вернул 56 живых лотов (17 693 по Москве), cian_card по 6 карточкам — ok, истории сохранены, реальная структура [{\"changed_at\": ISO, \"price_rub\": N}]. Примеры живой истории: Клубный дом ОПУС +0.10%, LUMIN +4.36%, БРЮСОВ +6.63%, HIGH LIFE +1.00% (снижений 0, роста 4). НО наших 6 конкурентов в выдаче нет: у коннектора нет текстового поиска и он не принимает newbuilding_name/category/seller_type, а перебор 17 693 лотов невежлив.\n\nРЕШЕНИЕ (предлагаю вместо правки чужого кода) — СВЯЗКА ДВУХ ИСТОЧНИКОВ:\n  1) НАШ HTTP-СБОР уже умеет открывать СТРАНИЦЫ ПРОЕКТОВ наших конкурентов на Циан (28 лотов, цены, площади) — из этой же страницы можно взять ССЫЛКИ/ID лотов (cian.ru/sale/flat/<id>/).\n  2) Далее по каждому id вызывать cian_card через коннектор — и получать историю цены КОНКРЕТНОГО лота нашего конкурента.\n  Так мы не зависим от отсутствующего фильтра и не перебираем всю выдачу.\n\nЧТО СДЕЛАТЬ (write-scope: 01-competitor-watch/scripts/**, tests/**, data/**):\n1) В парсере страницы проекта (platforms.py / адаптер Циан) добавит","descriptionFirstLine":"T71 — История цен по НАШИМ конкурентам: связать HTTP-сбор с коннектором через offer_id","writeScopes":["marketing-agents/01-competitor-watch/scripts","marketing-agents/01-competitor-watch/tests","marketing-agents/01-competitor-watch/data"],"blockedBy":[]},{"id":"task-72","subject":"T72: коннектор — фильтр по новостройке (поиск внутри конкретного ЖК)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793547209936,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T72 — Коннектор: фильтр по ЗВЕДЕНО LEAD ИНСТРУМЕНТАЛЬНО (CDP-клик по реальной странице, Chrome на порту 9222):\n  ДО клика:   seg-btn on = «По конкурентам»; таблица: Проект | Класс | Расстояние | Лотов | Медиана ₽/м² | Мин. вход, ₽ | …\n  клик «По метрикам»  → подсветка переехала на «По метрикам», НО содержимое ТО ЖЕ (та же таблица конкурентов);\n  клик «По источникам» → подсветка на «По источникам», содержимое ТО ЖЕ;\n  клик «По конкурентам» → подсветка вернулась, содержимое то же.\n  Вывод: состояние режима меняется, а ПЕРЕРИСОВКА содержимого не происходит. Элемент формально «работает», фактически — не работает.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) Сделать так, чтобы СМЕНА РЕЖИМА МЕНЯЛА СОДЕРЖИМОЕ (не только класс кнопки):\n   • «По конкурентам» — строка = конкурент, столбцы = метрики (как сейчас);\n   • «По метрикам» — строка = МЕТРИКА, столбцы = конкуренты (значения в ячейках, с источниками в подсказке);\n   • «По источникам» — группировка по источникам данных (keys.so, cian/http, ","descriptionFirstLine":"T73 — КРИТИЧНО: переключатели «По конкурентам / По метрикам / По источникам» не меняют содержимое","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-74","subject":"T74: автотест UX через CDP + чек-лист (поведение, а не разметка)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793547627801,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T74 — Автотест UX (CDP) + чек-лист: проверка поведения, а не разметки\n\nПРИЧИНА: переключатели в «Аналитике» прошли приёмку, потому что проверялось НАЛИЧИЕ элементов в DOM, а не их ПОВЕДЕНИЕ. Пользователь просит: при добавлении любой страницы/блока/тумблера сразу проверять по всем пунктам UX.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**, marketing-agents/docs/**):\n1) НОВЫЙ ИНСТРУМЕНТ: dashboard/ux-check.mjs — автотест через Chrome DevTools Protocol (Chrome уже запускается с портом 9222 скриптом 00-admin/scripts/start-chrome-cdp.ps1; node 24, WebSocket доступен). Что проверяет:\n   • каждый переключатель/вкладка/аккордеон: после клика содержимое ОБЯЗАНО измениться (сравнение «до/после» по заголовкам и первым строкам); если изменился только класс — ПРОВАЛ;\n   • поиск: ввод текста сужает строки; фильтры: меняют количество строк; сортировка: меняет порядок первых строк;\n   • модальные окна и выдвижные панели: открываются, закрываются Esc, кликом вне, кнопкой; после закрытия скролл не заблокирован;\n   • меню: боковое (все пункты открывают свой раздел), меню пользователя (6 пунктов реагируют), «+ Создать»;\n   • адресная строка: #раздел и #agents/<вкладка> открывают нужное; наза","descriptionFirstLine":"T74 — Автотест UX (CDP) + чек-лист: проверка поведения, а не разметки","writeScopes":["marketing-agents/dashboard","marketing-agents/docs"],"blockedBy":[]},{"id":"task-75","subject":"T75: аудит пути пользователя (Customer Journey) — панель и сервис","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793547627810,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T75 — Аудит пути пользователя (Customer Journey) панели и сервиса\n\nПОЛЬЗОВАТЕЛЬ: «путь пользователя — весь процесс взаимодействия, от первого знакомства с продуктом до техподдержки и повторных покупок». Нужен разбор и конкретные улучшения.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/docs/**):\n1) Пройти путь по шагам НА ФАКТИЧЕСКОМ ПРОДУКТЕ (панель + лендинг) и зафиксировать, что есть и чего нет:\n   • знакомство (лендинг marketing-agents/landing): понятно ли за 5 секунд, что продаём, кому и за сколько; есть ли призыв к действию; что происходит после заявки;\n   • первый вход в кабинет клиента (поверхность «Клиент»): что человек видит первым, понимает ли, что делать; есть ли чек-лист первого шага; как подключается услуга;\n   • работа оператора (поверхность «Оператор»): за сколько кликов он выполняет частые задачи (создать клиента, запустить услугу, отправить отчёт, выставить счёт);\n   • получение результата: где готовый отчёт, как он уходит клиенту, что видно в «Результатах»;\n   • оплата и подписка: как выставляется счёт, что видно при просрочке, как продлить;\n   • поддержка: как задать вопрос, есть ли FAQ/обучение, что при сбое (тревоги и их понятность);\n   • возврат и повтор: истори","descriptionFirstLine":"T75 — Аудит пути пользователя (Customer Journey) панели и сервиса","writeScopes":["marketing-agents/docs"],"blockedBy":[]},{"id":"task-76","subject":"T76: панель не должна показывать старую версию (кэш статики + версия интерфейса)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793547851596,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T76 — Панель: не показывать пользователю старую версию (кэш статики)\n\nНАХОДКА LEAD (важно, объясняет жалобу «опять не работают»):\n  Я проверил переключатели Аналитики через CDP дважды. Первый раз — на вкладке, которая уже была открыта: клики по «По метрикам»/«По источникам» меняли ТОЛЬКО подсветку, содержимое не менялось, адрес оставался #analytics. Второй раз — с принудительным обходом кэша (Network.setCacheDisabled + Page.reload{ignoreCache:true} + ?cb=timestamp): всё заработало правильно — #analytics/metrics (первый столбец «Метрика»), #analytics/sources (первый столбец «Источник», объём раздела 5636 против 11755), #analytics/competitors («Проект»).\n  Вывод: в первом тесте браузер держал СТАРЫЙ app-views14.js. То есть после каждой правки панели пользователь может видеть ПРЕДЫДУЩУЮ версию до жёсткого обновления (Ctrl+F5) — и справедливо считать, что «ничего не исправлено». Это и есть вероятная причина повторяющихся жалоб.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) В serve.mjs: для HTML и JS/CSS панели отдавать заголовки, запрещающие кэширование (Cache-Control: no-store, no-cache, must-revalidate + Pragma: no-cache + Expires: 0). Данные (public/data/*.json) можн","descriptionFirstLine":"T76 — Панель: не показывать пользователю старую версию (кэш статики)","writeScopes":["marketing-agents/dashboard","marketing-agents/docs/ux-checklist.md"],"blockedBy":[]},{"id":"task-77","subject":"T77: убрать залипшую плашку подтверждения после выполнения действия","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793549529077,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T77 — Панель: убрать «залипшую» плашку подтверждения после выполнения действия\n\nНАЙДЕНО ЗАМОРОЖЕННЫМ UX-АВТОТЕСТОМ (версия 68834c91, прогон Lead): OK 20, ПРОВАЛ 1 — actions.staleConfirm.\n\nСУТЬ ДЕФЕКТА: после УСПЕШНОГО выполнения действия плашка «Подтверждение: … — нажмите ту же кнопку ещё раз, чтобы выполнить» остаётся на экране. Проверено через 11 секунд после появления результата.\n  «Собрать данные сейчас»: результат появился («Данные пересобраны»), а плашка «Подтверждение: …» висит.\n  «Сформировать отчёт за неделю»: результат появился («Отчёт построен…»), плашка тоже висит.\nПОЧЕМУ ЭТО ВАЖНО: пользователь видит одновременно «готово» и «подтвердите ещё раз» и не понимает, выполнено действие или нет. Это тот же класс, что «действие без видимой реакции», только наоборот — реакция противоречивая.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) Убирать .confirm-note (плашку подтверждения) при СТАРТЕ выполнения действия (runAction) и при появлении результата. Одно действие — одно состояние: либо «подтвердите», либо «выполняется», либо «готово».\n2) Проверить все действия, использующие панельное подтверждение (не только две кнопки), чтобы нигде не оставалось залипшей плашки","descriptionFirstLine":"T77 — Панель: убрать «залипшую» плашку подтверждения после выполнения действия","writeScopes":["marketing-agents/dashboard"],"blockedBy":[]},{"id":"task-78","subject":"T78 (P0): клиентский кабинет — чистая поверхность + онбординг 3 шага","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793549730191,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T78 (P0) — Клиентский кабинет: убрать операторские данные и кнопки + онбординг первого входа\n\nИСТОЧНИК: docs/customer-journey.md (аудит пути, шаг 2). ФАКТ из аудита: поверхность «Клиент» — это режим просмотра операторского пульта. Клиент видит внутренние данные сервиса: «ДОХОД УСЛУГ 28 500,00 ₽», «СРЕДНЯЯ МАРЖА 99,2 %», а также операторские кнопки «Запустить услугу», «Продлить», «Выставить счёт». Это одновременно и UX-провал, и утечка коммерческих данных.\n\nЧТО СДЕЛАТЬ (write-scope: marketing-agents/dashboard/**):\n1) ЧИСТКА ВИДА «КЛИЕНТ» (главное):\n   • убрать ВСЕ операторские показатели (доход, маржа, себестоимость, расходы панели, экономика сервиса, долги других клиентов, внутренние очереди);\n   • убрать ВСЕ операторские действия (запуск услуги, продление, выставление счёта, отправка отчёта, смена режимов работы);\n   • оставить только то, что принадлежит клиенту: его объекты, его услуги, его отчёты, его подписка и счета, история изменений по его объектам, «Вопрос агенту» t":"T13: приём задач голосом из Телемоста (аудио -> расшифровка -> задачи)","group":"Сборка системы","category":"Задачи команды","owner":"agent-1-competitor-watch","ownerLabel":"Агент 1 — Мониторинг конкурентов","ownerName":"data-engine","status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793455525901,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":false,"revision":3,"description":"T13 — Приём задач голосом из Яндекс Телемоста (без API у Телемоста)\n\nПОЛЬЗОВАТЕЛЬ ВЫБРАЛ: «голосом — записать встречу/голосовое, получить расшифровку, разложить на задачи».\nУ Телемоста нет публичного API, поэтому путь такой: пользователь записывает встречу (или голосовое) и кладёт файл в папку; мы делаем расшифровку и превращаем её в задачи реестра.\n\nАРТЕФАКТЫ (write-scope: marketing-agents/registry/intake/** и marketing-agents/registry/tasks/**):\n1) registry/intake/README.md — по-русски: куда что класть (inbox/audio — аудио/видео, inbox/text — готовые транскрипты и заметки), поддерживаемые форматы, как получить запись из Телемоста, лимиты, что делать если расшифровка не удалась.\n2) registry/intake/scripts/transcribe.* — расшифровка аудио в текст (русский).\n   ВАЖНО, сначала разведка: в системе уже есть локальный движок речи C:\\Users\\Артем\\.dsh\\speech-to-text\\sensevoice\\models и включён voice-input bundle. Выясни, есть ли CLI/скрипт для расшифровки ФАЙЛА (ищи в ресурсах DSH: app.asar.unpacked, node_modules, python-пакеты). Если локально нельзя — честно зафиксируй это и предложи рабочий обход: (а) расшифровка средствами самого Телемоста/Яндекс, (б) внешний ASR. НЕ выдумывай несущест","descriptionFirstLine":"T13 — Приём задач голосом из Яндекс Телемоста (без API у Телемоста)","writeScopes":["marketing-agents/registry/intake","marketing-agents/registry/tasks"],"blockedBy":[]},{"id":"task-14","subject":"T14: подключить Циан/Авито к Агенту 1 через Chrome CDP + реальный y":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793459139615,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T16 — Дашборд: вкладки «Интеграции API» и «Источники мониторинга»\n\nВАЖНО: сначала закрой T15 (автономный HTML + .cmd), потом бери T16.\n\nКОНТРАКТЫ (Lead уже создал, читай их):\n- marketing-agents/registry/sources.yaml — источники мониторинга (id, name, enabled, kind, auth, status, priority, last_run, limits, howto, note). Тумблер правит enabled.\n- marketing-agents/registry/integrations-catalog.yaml — что МОЖНО подключить (id, name, kind, purpose, status_hint, key_env/package, where).\n\n1) ВКЛАДКА «ИНТЕГРАЦИИ API» — два блока:\n   A. «Подключено» — определяется ФАКТИЧЕСКИ, не по мнению: из профиля DSH (C:\\Users\\Артем\\.dsh\\profiles\\desktop\\package.json -> dsh.profile.bundles и dependencies) + проверка, что каталог пакета есть в node_modules и у него есть точка входа/патч (логику можно взять из marketing-agents/install/check-profile-bundles.mjs). Показывай: имя, версия, назначение (из каталога, если есть), статус загрузки (в бандлах / установлен но выключен), нужен ли ключ.\n   B. «Можно подключить» — из integrations-catalog.yaml минус уже подключённые: назначение, что даёт, как подключить (команда dsh plugin add или где взять ключ).\n   СЕКРЕТЫ: проверяй только ФАКТ наличия ключа (env-пере","descriptionFirstLine":"T16 — Дашборд: вкладки «Интеграции API» и «Источники мониторинга»","writeScopes":["marketing-agents/dashboard"],"blockedBy":["task-15"]},{"id":"task-17","subject":"T17: публичная тестовая страница дашборда (туннель, только чтение)","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793459139620,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T17 — ПУБЛИЧНАЯ ТЕСТОВАЯ СТРАНИЦА дашборда (доступ с телефона)\n\nЦЕЛЬ: пользователь хочет открыть рабочий кабинет с телефона по ссылке из интернета. Публикуем ТОЛЬКО ЧТЕНИЕ, без возможности что-то переключить, и без секретов.\n\nБЕЗОПАСНОСТЬ (критично):\n- Публикуемая копия — статические файлы, БЕЗ серверного API (никаких /api/agents/toggle), без записи в файлы.\n- В публикуемой копии не должно быть ключей, путей к .credentials.yaml, содержимого реестра с чувствительными полями. Проверь поиском по публикуемой папке: ZVENOAI|SERPER|SANDBASE|TOKEN|credentials|password — не должно быть значений (упоминания «ключа нет/есть» — это булев флаг, допустимо).\n- В шапке страницы напиши крупно: «Тестовая копия • только просмотр • данные на <дата/время>».\n\nЧТО СДЕЛАТЬ:\n1) marketing-agents/install/publish/ — папка публикации: скрипт build-publish.mjs копирует статику дашборда (dashboard/public/**) в install/publish/site/ и заменяет обращения к /api/state на встроенный файл data/state.json (или использует автономный HTML из T15, если он уже собран). Никаких POST.\n2) Туннель: скачай cloudflared для Windows в marketing-agents/install/tools/cloudflared.exe (официальный релиз GitHub cloudflare/cloudflared","descriptionFirstLine":"T17 — ПУБЛИЧНАЯ ТЕСТОВАЯ СТРАНИЦА дашборда (доступ с телефона)","writeScopes":["marketing-agents/install"],"blockedBy":[]},{"id":"task-18","subject":"T18: источники — реальное вкл/выкл в сборе + журнал запусков","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793459139624,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T18 — Тумблеры источников должны реально влиять на сбор + журнал запусков\n\nПОЧЕМУ: пользователь просит вкладку «Источники мониторинга» с включением/выключением и статистикой. Тумблер обязан иметь последствия, иначе это картинка.\n\nКОНТРАКТ (Lead создал): marketing-agents/registry/sources.yaml — поле enabled. Скрипты сбора обязаны пропускать источники с enabled: false.\n\nЧТО СДЕЛАТЬ (write-scope: 01-competitor-watch/scripts/**, 01-competitor-watch/tests/**, 01-competitor-watch/data/**):\n1) scripts/sources_tool.py — CLI: list (таблица: id, enabled, status, last_run), enable <id>, disable <id>, status <id>.\n   - правка только своего поля в sources.yaml, атомарно (temp+rename), бэкап .bak-<timestamp>, комментарии и порядок строк сохраняются (как в мини-YAML дашборда — можно взять тот же подход, но реализуй у себя);\n   - повторный enable/disable идемпотентен; неизвестный id — понятная ошибка, код 1.\n2) scripts/log_source_run.py — добавляет запись в 01-competitor-watch/data/source-runs.jsonl:\n   {\"ts\":\"<ISO>\",\"source\":\"<id>\",\"status\":\"ok|partial|blocked|empty\",\"lots\":<N>,\"projects\":<N>,\"note\":\"...\"}\n   Требования: только добавление (append), один JSON в строке, устойчивость к параллельной ","descriptionFirstLine":"T18 — Тумблеры источников должны реально влиять на сбор + журнал запусков","writeScopes":["marketing-agents/01-competitor-watch/scripts","marketing-agents/01-competitor-watch/tests","marketing-agents/01-competitor-watch/data"],"blockedBy":[]},{"id":"task-19","subject":"T19: дашборд для Тильды — мобильная страница «Панель управления»","group":"Сборка системы","category":"Задачи команды","owner":null,"ownerLabel":null,"ownerName":null,"status":"done","statusRaw":"completed","project":null,"due":null,"overdue":false,"source":"dsh-session","created":null,"createdMs":1793459691694,"quote":null,"origin":"dsh","originLabel":"лог DSH","file":null,"ownerUnknown":true,"revision":3,"description":"T19 — Дашборд для Тильды (мобильная «Панель управления»)\n\nЦЕЛЬ: пользователь
