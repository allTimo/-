# ============================================================================
# settings.yaml — ПРАВИЛА РАБОТЫ АГЕНТА 1 (КОНКУРЕНТНЫЙ МОНИТОРИНГ)
# ============================================================================
# ЗАЧЕМ ЭТОТ ФАЙЛ:
#   Здесь заданы «правила игры»: за какой период сравнивать, что считать
#   значимым изменением, какие слова считать акцией, в каком виде и куда
#   отдавать отчёт. Меняйте значения аккуратно — от них зависит весь отчёт.
#
# КАК МЕНЯТЬ: заменяйте только значение после двоеточия, структуру не трогайте.
# Комментарии (строки с «#») можно оставлять.
#
# ПРИМЕЧАНИЕ: конфиг адаптирован под еженедельный мониторинг ЖК «Свет»
# (Дмитровское шоссе, 83А). Значения порогов и периодов оставлены базовыми;
# при необходимости их можно ужесточить или ослабить под вашу кампанию.
# ============================================================================

version: 1
updated: "2026-10-31"

# --- Период сравнения ------------------------------------------------------
period:
  days: 7                     # Сравниваем текущий снимок с снимком 7 дней назад.
  snapshot_weekday: "monday"  # День сбора недельного снимка (пн).
  compare_mode: "week_over_week"   # week_over_week | previous_snapshot
  # week_over_week  — сравнивать с снимком ровно N дней назад;
  # previous_snapshot — сравнивать с предыдущим по дате снимком (если сбор пропущен).
  # Период задаётся датами --prev/--curr у движка; days ниже — справочное значение
  # (реальное применение period.days — задача T6, на 30.10.2026 ещё не внедрена).

# --- Порог значимости ------------------------------------------------------
thresholds:
  price_change_pct: 0.5        # Изменение цены меньше 0.5% считаем шумом и в отчёт не выносим.
  price_change_abs_rub: 0      # 0 = порог по абсолютной сумме не применяется.
  lot_count_change_abs: 3      # Приход/уход менее 3 лотов по проекту — не выносим в «Главное».
  median_price_change_pct: 0.5 # Порог для медианы ₽/м² по проекту.
  min_lots_for_stats: 3        # Проект с меньшим числом лотов не попадает в медианные таблицы.

# --- Ключевые слова акций и промо -----------------------------------------
# Если текст акции/описания содержит любое из этих слов — ставим promo_flag=1
# и переносим фрагмент текста в колонку promo_text.
promo_keywords:
  - "скидка"
  - "акция"
  - "рассрочка"
  - "ипотека от"              # ищется вместе с процентом, например «ипотека от 3%»
  - "субсидированная ставка"
  - "трейд-ин"
  - "старт продаж"
  - "последние лоты"
  - "кэшбэк"
  - "мебель в подарок"
  - "паркинг в подарок"
promo_keywords_match_case: false   # false = искать без учёта регистра

# --- Единицы измерения и валюта -------------------------------------------
units:
  currency: "RUB"
  currency_symbol: "₽"
  price_unit: "rub_total"       # полная цена лота, рублей
  price_per_m2_unit: "rub_per_m2"  # цена за квадратный метр, рублей
  area_unit: "m2"
  area_decimals: 1              # площадь округляем до 1 знака
  price_round_to_rub: 1000      # деньги в отчёте округляем до 1000 ₽ (решение Lead)
  pct_decimals: 2               # проценты в отчёте — 2 знака (решение Lead)

# --- Язык и формат вывода --------------------------------------------------
output:
  language: "ru"               # язык отчёта
  formats:
    - "md"                     # обязательный: reports/<YYYY-MM-DD>-competitor-watch.md
    - "xlsx"                   # обязательный: reports/<YYYY-MM-DD>-competitor-watch.xlsx
  csv_encoding: "utf-8-sig"    # КОДИРОВКА CSV ДЛЯ EXCEL — не менять (иначе кракозябры)
  # Пути относительные: движок считает их от marketing-agents, а не от текущего каталога.
  report_dir: "01-competitor-watch/reports"           # куда складывать отчёты
  snapshot_dir: "01-competitor-watch/data/snapshots"  # куда складывать снимки
  # filename_* — имена совместимой копии, которую дополнительно кладёт алиас build_report.py
  # в reports/<YYYY-MM-DD>/; основной отчёт всегда <YYYY-MM-DD>-competitor-watch.*
  filename_md: "weekly-report.md"
  filename_xlsx: "weekly-report.xlsx"
  decimals_separator: ","      # десятичный разделитель в русском отчёте

# --- Куда отправлять отчёт (текстом; автоматической отправки нет) ----------
delivery:
  send_mode: "manual"          # manual — отчёт готовит агент, отправляете вы сами
  telegram:
    enabled: false
    target: ""                 # например "@my_channel" или "username"
    note: "Укажите канал/чат. Автоотправка в этой версии выключена."
  email:
    enabled: false
    to: ""                     # например "me@example.com"
    subject_template: "Конкуренты, неделя {date_from}–{date_to}"
    note: "Укажите адрес. Автоотправка в этой версии выключена."

# --- Разделы отчёта: СПРАВОЧНОЕ ЗЕРКАЛО (НЕ управляет отчётом) -------------
# ВАЖНО: заголовки 9 разделов ФИКСИРОВАНЫ в движке (build_weekly_report.py).
# Правка списка ниже НЕ меняет текст отчёта: движок печатает свои заголовки.
# Движок сверяет этот список и ПРЕДУПРЕЖДАЕТ, если:
#   • число разделов не 9; • нумерация не совпадает с порядком 1..9;
#   • список отсутствует или не список.
# Предупреждение попадает в уведомления отчёта и в stdout.
# Порядок и число (9) не менять. Значения title скопированы дословно из
# фактического отчёта движка (проверено прогоном 2026-10-23 → 2026-10-30).
report_sections:
  - key: "header"
    title: "1. Заголовок и охват"
  - key: "highlights"
    title: "2. Главное за неделю"
  - key: "prices_median"
    title: "3. Цены: медиана ₽/м² по проектам"
  - key: "lot_price_changes"
    title: "4. Изменения цен по лотам"
  - key: "promo"
    title: "5. Акции и промо"
  - key: "supply"
    title: "6. Предложение: лоты в продаже, приход и уход"
  - key: "rooms_breakdown"
    title: "7. Срез по комнатности"
  - key: "recommendations"
    title: "8. Выводы и рекомендации"
  - key: "limitations"
    title: "9. Ограничения и что не удалось собрать"

# --- Контракт данных (НЕ МЕНЯТЬ) -------------------------------------------
# Снимок недели: 01-competitor-watch/data/snapshots/<YYYY-MM-DD>/lots.csv
# Колонки строго в этом порядке:
data_contract:
  snapshot_file: "data/snapshots/<YYYY-MM-DD>/lots.csv"
  columns:
    - snapshot_date
    - source
    - competitor
    - project
    - lot_id
    - url
    - rooms
    - area_m2
    - floor
    - floors_total
    - building
    - price_rub
    - price_per_m2_rub
    - finish
    - promo_flag
    - promo_text
    - delivery
    - status
  lot_key: ["source", "competitor", "project", "lot_id"]   # ключ сопоставления лотов
  enums:
    source: ["cian", "avito", "yandex_realty", "site", "other"]   # допустимые значения колонки source
    rooms: "0 = студия, 1..5 = число комнат, 6 = 5+"
    finish: ["без отделки", "white box", "чистовая", "с мебелью", "unknown"]
    promo_flag: [0, 1]
    delivery: "YYYY-QN"
    status: ["active", "reserved", "sold"]
  # lot_id должен быть СТАБИЛЬНЫМ между неделями: если у источника нет своего id,
  # берётся хэш ссылки на лот (иначе лот не сопоставится и даст ложный приход/уход).
  lot_id_fallback: "hash(url)"
  derived:
    price_per_m2_rub: "если пусто — досчитывается как price_rub / area_m2, округление до 1 ₽"

# --- Качество и предупреждения --------------------------------------------
quality:
  warn_if_lots_below: 10       # если в снимке меньше 10 лотов — предупреждение в отчёте
  warn_if_source_missing: true # если по конкуренту нет ни одного источника — писать в «Ограничения»
  drop_duplicates: true        # дубли по lot_key удаляем
  keep_history: true           # старые снимки НЕ удалять (нужны для Δ)