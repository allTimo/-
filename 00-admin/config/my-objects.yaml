# ============================================================================
# my-objects.yaml — НАШИ ОБЪЕКТЫ (наши жилые комплексы)
# ============================================================================
# ЗАЧЕМ ЭТОТ ФАЙЛ:
#   Здесь перечислены ВАШИ жилые комплексы (ЖК), которые вы рекламируете.
#   Агент 1 сверяет конкурентов именно с ними: в отчёте появится раздел
#   «Выводы и рекомендации для наших кампаний» с привязкой к этим ЖК.
#
# КАК ЗАПОЛНЯТЬ (для человека без технического бэкграунда):
#   1. Откройте файл в любом текстовом редакторе (Блокнот, VS Code).
#   2. Ниже приведён заполненный блок для ЖК «Свет». При необходимости
#      добавьте ещё один ЖК, скопировав блок целиком (от «- id:» до
#      последней строки блока) и вставив его ниже.
#   3. Строки, начинающиеся с «#», — это комментарии, компьютер их не читает.
#      Их можно оставлять и дописывать.
#   4. Отступы — ТОЛЬКО пробелы (2 пробела на уровень). Табуляцию не ставьте:
#      YAML сломается. Регистр в названиях полей важен: name, developer, class...
#   5. Скопируйте блок любого ЖК целиком (от «- id:» до последней строки блока)
#      и вставьте ниже, чтобы добавить ещё один ЖК.
#
# ОБЯЗАТЕЛЬНЫЕ ПОЛЯ (без них агент не построит сравнение):
#   id, name, developer, class, okrug, location, start_of_sales, delivery,
#   site_url, usp
# НЕОБЯЗАТЕЛЬНЫЕ ПОЛЯ:
#   key_competitors (список id конкурентов из competitors.yaml — очень полезен),
#   notes
# ============================================================================

