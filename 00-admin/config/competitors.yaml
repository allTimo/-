# ============================================================================
# КАК ЗАПОЛНЯТЬ ССЫЛКИ ПРАВИЛЬНО
# ============================================================================
# cian_url          — ссылка на страницу ЖК (или выдачу) на Циан.
# avito_url         — ссылка на страницу ЖК/застройщика на Авито (может отсутствовать).
# yandex_realty_url — ссылка на карточку ЖК в Яндекс Недвижимости.
# site_url          — официальный сайт ЖК (самая надёжная точка: цены и акции от застройщика).
# Если ссылки нет — оставьте "", НЕ удаляйте строку: так структура одинакова у всех.
#
# ПРИМЕЧАНИЕ О ДАННЫХ (обновлено 2026-10-31):
#   • ОСНОВНОЙ путь сбора — официальные сайты застройщиков (site_url), обычный HTTP,
#     без авторизации: 00-admin/scripts/collect-developer-sites.mjs, затем
#     build-snapshot-from-site.py. В снимке такие лоты идут с source=site.
#   • ЦИАН И АВИТО — ОТЛОЖЕНЫ по решению пользователя (2026-10-31). Ссылки cian_url/avito_url
#     оставлены на будущее, но в недельном цикле сейчас не используются.
#   • site_status у каждого конкурента — результат фактической проверки 2026-10-31
#     (команда: node 00-admin/scripts/collect-developer-sites.mjs --probe <url>).
#   • Разведка источников: 00-admin/research/sources-research-2026-10-30.md
#     (там же приложение от 2026-10-31 про сайты застройщиков).