# ============================================================================
# competitors.yaml — КОНКУРЕНТЫ
# ============================================================================
# ЗАЧЕМ ЭТОТ ФАЙЛ:
#   Список конкурентов, по которым Агент 1 неделя за неделей собирает и
#   сравнивает цены, акции и предложение. Чем точнее список — тем полезнее отчёт.
#
# КАК ДОБАВИТЬ НОВОГО КОНКУРЕНТА ЗА 1 МИНУТУ:
#   1. Найдите ЖК на Циан, скопируйте ссылку на страницу ЖК.
#   2. Скопируйте последний блок «- id:» целиком и вставьте ниже.
#   3. Замените id (латиница, дефис), name, developer и вставьте ссылки.
#   4. Сохраните файл — готово. Конкурент попадёт в следующий недельный цикл.
#   Подробнее: 00-admin/runbook.md, раздел «Как добавить конкурента/ЖК».
#
# ОБЯЗАТЕЛЬНЫЕ ПОЛЯ: id, name, developer, class, okrug, location, delivery,
#   cian_url, priority
# НЕОБЯЗАТЕЛЬНЫЕ ПОЛЯ: avito_url, yandex_realty_url, site_url, notes
#   (если ссылки нет — оставьте пустые кавычки "", агент будет искать
#   данные по другим источникам, о пропуске сообщит в разделе «Ограничения»).
#
# ДОПУСТИМЫЕ ЗНАЧЕНИЯ:
#   class:    премиум | бизнес
#   priority: high | medium | low   (high — следим пристально, попадает в «Главное за неделю»)
#   okrug:    ЦАО, САО, СВАО, ВАО, ЮВАО, ЮАО, ЮЗАО, ЗАО, СЗАО, НАО, ТАО
#   delivery: YYYY-QN, например 2025-Q4
#
# ВАЖНО: id конкурента используется в my-objects.yaml (поле key_competitors)
#        и как значение колонки competitor в data/snapshots/<дата>/lots.csv.
#        Менять id после запусков нежелательно — сломается сопоставление истории.
# ============================================================================

