# --- Минус-слова уровня кампании (общие для всех кампаний) -------------------
# Мусорные интенты по регламенту Агента 2. Требование Директа: не более 20 000 знаков
# без пробелов на кампанию и не более 7 слов в одной минус-фразе — здесь запас большой.
minus_words_campaign:
  - "аренда"
  - "снять"
  - "сдать"
  - "сдам"
  - "вторичка"
  - "вторичное жилье"
  - "б/у"
  - "работа"
  - "вакансии"
  - "отзывы"
  - "фото"
  - "жкх"
  - "аварийный"
  - "снос"
  - "форум"
  - "ремонт"
  - "обои"
minus_words_note: "Список минимальный (по регламенту). Расширять по факту поисковых запросов после запуска: у каждого нового минуса — причина в keywords/<date>-minus-words.txt"

