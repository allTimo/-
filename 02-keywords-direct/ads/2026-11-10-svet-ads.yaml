# Объявления Яндекс Директа — ЖК «Свет» (черновик) — 2026-11-10 — подготовил Агент 2, регламент direct-keywords
# Источники фактов: 00-admin/config/my-objects.yaml (УТП объекта). Ничего вне УТП в тексты не добавлено.
# Группы соответствуют clusters/2026-11-10-svet-clusters.md и campaigns/2026-11-10-svet-structure.yaml.
#
# ЛИМИТЫ СВЕРЕНЫ 2026-11-10 (дата сверки). Инструмент web_search в этой сессии был недоступен
# (ошибка «DeepSeek API error (HTTP 402): Insufficient Balance»), поэтому лимиты сверены напрямую
# по официальной Справке Директа и документации API v5 через web_fetch 2026-11-10:
#   - количественные ограничения: https://yandex.ru/support/direct/ru/troubleshooting/interface#limitations
#   - быстрые ссылки: https://yandex.ru/support/direct/ru/efficiency/quick-links
#   - уточнения: https://yandex.ru/support/direct/ru/efficiency/callout
#   - объект SitelinksSet (1–8 ссылок): https://yandex.ru/dev/direct/doc/ru/objects/sitelink
#   - объект AdExtension (до 50 уточнений): https://yandex.ru/dev/direct/doc/ru/objects/adextension
#   - объект Ad (типы объявлений, ТГО только для редактирования): https://yandex.ru/dev/direct/doc/ru/objects/ad
#
# ВАЖНО про два заголовка: классическая схема «Заголовок 1 (56) / Заголовок 2 (30)» относится к
# текстово-графическим объявлениям (TEXT_AD). По документации на 2026-11-10 в Единой перфоманс-кампании
# новые текстово-графические объявления не создаются (с 30 июня они доступны только для редактирования),
# а создаются комбинаторные (RESPONSIVE_AD) с заголовками до 56 знаков. Поэтому здесь оба заголовка
# даны с запасом под оба формата: title1 ≤ 56, title2 ≤ 30; при выгрузке в комбинаторном формате
# title2 переносится в список дополнительных заголовков (лимит тот же — 56).
#
# Дисклеймер: «не является офертой» размещается на посадочной странице и в рекламных материалах
# (требования к рекламе застройщиков); в текстах объявлений он добавлен там, где речь о цене и условиях
# покупки. Точные цифры цен, ставок и скидок в объявления НЕ включены — данных от клиента нет.
# Маркировка рекламы (ERID) проверяется до выгрузки — отдельная задача.

limits_checked_at: "2026-11-10"
limits:
  title1_max: 56
  title_word_max: 22
  title2_max: 30            # лимит текстово-графического формата; в комбинаторном дополнительный заголовок — до 56
  text_max: 81
  text_punctuation_max: 15
  text_word_max: 23
  sitelinks_max: 8
  sitelink_title_max: 30
  sitelink_description_max: 60
  callouts_max: 50
  callout_max: 25
  callout_total_desktop: 132
  callout_total_mobile: 76
rent_note: "Тон сдержанный: без «дёшево», «успей», «только сегодня». Для бизнес-класса — спокойные формулировки."

# --- Быстрые ссылки ----------------------------------------------------------
# URL разделов на https://svetdom.ru/ не подтверждены конфигом — НУЖНО ОТ КЛИЕНТА.
# Для выгрузки в Директ требуются абсолютные URL: без них набор быстрых ссылок не создать.
sitelinks_sets:
  svet_main:
    status: "черновик: тексты готовы, URL — НУЖНО ОТ КЛИЕНТА"
    links:
      - title: "Выбрать квартиру"
        description: "Подбор лота по параметрам"
        url: "НУЖНО ОТ КЛИЕНТА (раздел на https://svetdom.ru/)"
      - title: "Планировки"
        description: "Планировочные решения проекта"
        url: "НУЖНО ОТ КЛИЕНТА (раздел на https://svetdom.ru/)"
      - title: "О проекте"
        description: "О небоскрёбе и инфраструктуре"
        url: "НУЖНО ОТ КЛИЕНТА (раздел на https://svetdom.ru/)"
      - title: "Ипотека и рассрочка"
        description: "Условия покупки — уточняйте"
        url: "НУЖНО ОТ КЛИЕНТА (раздел на https://svetdom.ru/)"
      - title: "Ход строительства"
        description: "Строительная готовность"
        url: "НУЖНО ОТ КЛИЕНТА (раздел на https://svetdom.ru/)"

# --- Уточнения (общий набор, лимит: до 25 знаков каждое) ---------------------
callouts_sets:
  svet_base:
    callouts:
      - "400 м до метро"
      - "52 этажа"
      - "Свой парк"
      - "SocialHUB"
      - "Бизнес-класс"
      - "Сдача — 2028"
